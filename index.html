<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamHub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0A1628;
  --surface:#0F1F38;
  --surface2:#16294A;
  --amber:#00AEEF;
  --teal:#F5F5F1;
  --text:#F5F5F1;
  --muted:#8FA3C2;
  --danger:#FF6161;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;
}
h1,h2,h3,.brand,.tile-title,.nav-label{
  font-family:'Space Grotesk','Inter',sans-serif;
}
/* ===== Layout ===== */
.app{display:flex;height:100vh;width:100vw;}
.sidebar{
  width:230px;
  background:linear-gradient(180deg,#0C1930,#0A1628);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;align-items:stretch;
  padding:22px 0;
  flex-shrink:0;
  z-index:20;
  overflow-y:auto;
}
.brand{
  color:var(--amber);
  font-weight:700;
  font-size:20px;
  letter-spacing:.5px;
  margin-bottom:28px;
  white-space:nowrap;
  overflow:hidden;
  width:100%;
  text-align:left;
  padding-left:22px;
  display:flex;align-items:center;gap:8px;
}
.nav-item{
  width:100%;
  display:flex;align-items:center;gap:14px;
  padding:13px 0 13px 28px;
  color:var(--muted);
  cursor:pointer;
  position:relative;
  white-space:nowrap;
  overflow:hidden;
}
.nav-item svg{flex-shrink:0;width:20px;height:20px;}
.nav-label{opacity:1;font-size:14px;font-weight:600;}
.nav-item.active{color:var(--amber);background:rgba(0,174,239,0.12);}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);
}
.nav-group{border-bottom:1px solid rgba(255,255,255,.05);padding-bottom:6px;margin-bottom:6px;}
.nav-group:last-of-type{border-bottom:none;}
.nav-group-label{
  font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:#4A6488;padding:14px 0 8px 28px;
}
.sidebar-spacer{flex:1;}
.sidebar-mini-preview{
  margin:0 16px 18px;padding:10px;border-radius:10px;background:var(--surface2);
  display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid rgba(255,255,255,.06);
}
.sidebar-mini-preview:hover{background:#1c355c;}
.mini-preview-thumb{
  width:46px;height:46px;border-radius:6px;background-size:cover;background-position:center;
  background-color:#0A1628;flex-shrink:0;
}
.mini-preview-info{overflow:hidden;}
.mini-preview-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.mini-preview-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item:focus-visible, .tile:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--teal);outline-offset:2px;
}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:64px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(180deg,rgba(10,14,20,.9),rgba(10,14,20,0));
}
.topbar h2{font-size:20px;font-weight:600;}
.clock{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}
.view{flex:1;overflow-y:auto;padding:8px 32px 40px;}
.view::-webkit-scrollbar{width:8px;}
.view::-webkit-scrollbar-thumb{background:#252c37;border-radius:4px;}

/* ===== Rows / tiles ===== */
.row{margin-bottom:34px;}
.row-title{font-size:16px;font-weight:600;margin-bottom:14px;color:#C9D2DC;}
.tiles{display:flex;gap:16px;overflow-x:auto;padding:8px 2px 14px;}
.tiles::-webkit-scrollbar{height:6px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}

.tile{
  position:relative;
  flex:0 0 200px;
  height:120px;
  border-radius:10px;
  background:var(--surface2);
  cursor:pointer;
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;
  transition:transform .18s ease;
  border:2px solid transparent;
}
.grid .tile{flex:none;width:100%;}
.tile:hover, .tile.focused{
  transform:scale(1.06);
  z-index:2;
  border-color:var(--amber);
  box-shadow:0 0 0 3px rgba(0,174,239,.35), 0 10px 24px rgba(0,0,0,.5);
}
.tile.focused::after{
  content:'';position:absolute;inset:-6px;border-radius:14px;
  background:conic-gradient(from 0deg, var(--amber), transparent 30%, transparent 70%, var(--amber));
  z-index:-1;
  animation:dial 2.4s linear infinite;
  opacity:.55;
}
@keyframes dial{to{transform:rotate(360deg);}}
.tile .thumb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.85;}
.tile .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.85));}
.tile-body{position:relative;padding:10px 12px;z-index:1;}
.tile-title{font-size:13px;font-weight:600;line-height:1.25;}
.tile-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.tile-badge{
  position:absolute;top:8px;right:8px;z-index:2;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,.55);color:var(--teal);letter-spacing:.5px;
}
.tile.add-tile{
  display:flex;align-items:center;justify-content:center;
  border:2px dashed #2a3340;background:transparent;
  color:var(--muted);font-size:28px;
}
.tile.add-tile:hover{color:var(--amber);border-color:var(--amber);}

/* ===== Hero ===== */
.hero{
  height:260px;border-radius:14px;position:relative;overflow:hidden;margin-bottom:32px;
  background:radial-gradient(circle at 20% 20%, #1c2431, #0A0E14 70%);
  display:flex;align-items:flex-end;padding:28px;
  border:1px solid rgba(255,255,255,.05);
}
.hero-netflix{
  height:300px;
  background:
    linear-gradient(180deg, rgba(10,10,10,0) 40%, rgba(10,10,10,1) 100%),
    radial-gradient(circle at 15% 25%, rgba(0,174,239,.35), transparent 55%),
    linear-gradient(135deg, #1a1a1a, #0A0A0A 70%);
  border:none;
}
.hero-actions{display:flex;gap:12px;margin-top:18px;}
.hero-btn{
  border:none;border-radius:6px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.hero-btn-primary{background:#fff;color:#000;}
.hero-btn-primary:hover{background:rgba(255,255,255,.85);}
.hero-btn-secondary{background:rgba(109,109,110,.5);color:#fff;}
.hero-btn-secondary:hover{background:rgba(109,109,110,.35);}
.hero h1{font-size:28px;margin-bottom:8px;}
.hero p{color:var(--muted);max-width:520px;font-size:14px;line-height:1.5;}
.hero .tag{color:var(--amber);font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:10px;text-transform:uppercase;}

/* ===== Forms ===== */
.panel{background:var(--surface);border-radius:12px;padding:24px;margin-bottom:24px;border:1px solid rgba(255,255,255,.05);}
.panel h3{font-size:15px;margin-bottom:16px;color:var(--amber);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a3340;
  background:#0D1218;color:var(--text);font-size:14px;font-family:inherit;
}
.field textarea{min-height:90px;resize:vertical;}
.row-inline{display:flex;gap:12px;}
.row-inline .field{flex:1;}
.btn{
  background:var(--amber);color:#FFFFFF;border:none;padding:10px 18px;border-radius:8px;
  font-weight:700;cursor:pointer;font-size:13px;letter-spacing:.3px;
}
.btn.secondary{background:transparent;border:1px solid #2a3340;color:var(--text);}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.btn:hover{filter:brightness(1.1);}
.subtabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.subtab{
  padding:8px 16px;border-radius:20px;background:var(--surface2);color:var(--muted);
  font-size:13px;cursor:pointer;font-weight:600;
}
.subtab.active{background:var(--amber);color:#FFFFFF;}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px;padding:10px 12px;background:rgba(255,255,255,.03);border-left:3px solid var(--teal);border-radius:4px;}
.note.danger{border-left-color:var(--danger);}
.note.ok{border-left-color:#3ECF8E;}
.empty{color:var(--muted);font-size:13px;padding:20px 0;}
.badge-pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(0,174,239,.15);color:var(--amber);letter-spacing:.3px;}
.badge-pill.ok{background:rgba(62,207,142,.15);color:#3ECF8E;}
.badge-pill.off{background:rgba(255,97,97,.12);color:var(--danger);}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.settings-row:last-child{border-bottom:none;}
.settings-row-label{font-size:13px;font-weight:600;}
.settings-row-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* ===== Player modal ===== */
.player-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;
  display:none;align-items:center;justify-content:center;flex-direction:column;
}
.player-overlay.open{display:flex;}
.player-box{width:min(1100px,92vw);}
.player-box video, .player-box iframe{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;border:none;}
.player-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.player-head h3{font-size:15px;}
.close-btn{background:var(--surface2);border:none;color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;}
.player-status{color:var(--muted);font-size:12px;margin-top:10px;}

.search-bar{
  display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:20px;padding:8px 16px;width:260px;
}
.search-bar input{background:transparent;border:none;color:var(--text);font-size:13px;width:100%;outline:none;}

/* ===== Lecteur intégré (plein écran dans la zone de contenu) ===== */
.player-page{display:flex;flex-direction:column;height:100%;}
.player-stage{
  flex:1;background:#000;border-radius:14px;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;min-height:0;
}
.player-stage video, .player-stage iframe{width:100%;height:100%;border:none;background:#000;}
.player-info{padding:18px 4px 6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.player-info h2{font-size:18px;font-weight:600;}
.player-info .sub{color:var(--muted);font-size:13px;margin-top:2px;}
.player-back{
  background:var(--surface2);border:none;color:var(--text);padding:10px 18px;border-radius:8px;
  cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;flex-shrink:0;margin-right:16px;
}
.player-back:hover{background:#232b37;}
.player-status-line{color:var(--muted);font-size:12px;margin-top:8px;}
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">📺 StreamHub</div>

    <div class="nav-group">
      <div class="nav-group-label">Accueil</div>
      <div class="nav-item active" data-view="home" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
        <span class="nav-label">À la une</span>
      </div>
      <div class="nav-item" data-view="guide" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/><path d="M7 13h3M7 16h6"/></svg>
        <span class="nav-label">Guide TV</span>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-group-label">Contenus</div>
      <div class="nav-item" data-view="youtube" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>
        <span class="nav-label">YouTube</span>
      </div>
      <div class="nav-item" data-view="molotov" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17V7l16-3v13"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="17" r="2"/></svg>
        <span class="nav-label">Molotov TV</span>
      </div>
      <div class="nav-item" data-view="m3u" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
        <span class="nav-label">Mes playlists</span>
      </div>
    </div>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-mini-preview" id="sidebarMiniPreview" style="display:none;">
      <div class="mini-preview-thumb" id="miniPreviewThumb"></div>
      <div class="mini-preview-info">
        <div class="mini-preview-label">Reprendre</div>
        <div class="mini-preview-title" id="miniPreviewTitle"></div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-group-label">Réglages</div>
      <div class="nav-item" data-view="sources" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
        <span class="nav-label">Réglages</span>
      </div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <h2 id="viewTitle">Accueil</h2>
      <div style="display:flex;align-items:center;gap:18px;">
        <div class="search-bar"><span>🔍</span><input id="globalSearch" placeholder="Rechercher une chaîne, une vidéo..."></div>
        <div class="clock" id="clock">--:--</div>
      </div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<script>
/* ===================== STORAGE ===================== */
const DB = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem('sh_'+k)) ?? d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem('sh_'+k, JSON.stringify(v)); }
};
let state = {
  youtube: DB.get('youtube', []),          // {id,title,type:'video'|'live'}
  m3u: DB.get('m3u', {url:'', raw:'', channels:[]}),
  history: DB.get('history', []),
  proxy: DB.get('proxy', ''),
  googleClientId: DB.get('googleClientId', ''),
  youtubeApiKey: DB.get('youtubeApiKey', ''),
  epgUrl: DB.get('epgUrl', 'https://xmltvfr.fr/xmltv/xmltv_fr.xml.gz'),
  subscriptions: [],
  view: 'home',
  settingsTab: 'general',
};

function save(){
  DB.set('youtube', state.youtube);
  DB.set('m3u', state.m3u);
  DB.set('history', state.history);
  DB.set('proxy', state.proxy);
  DB.set('googleClientId', state.googleClientId);
  DB.set('youtubeApiKey', state.youtubeApiKey);
  DB.set('epgUrl', state.epgUrl);
}
function pushHistory(item){
  state.history.unshift({...item, ts:Date.now()});
  state.history = state.history.slice(0,20);
  save();
  if(typeof updateMiniPreview === 'function') updateMiniPreview();
}

if(!state.epgUrl || state.epgUrl.includes('iptv-org/epg/gh-pages') || state.epgUrl.includes('epgshare01.online') || state.epgUrl.includes('xmltv_tnt.zip')){
  state.epgUrl = 'https://xmltvfr.fr/xmltv/xmltv_fr.xml.gz';
}
save();

/* ===================== NAV ===================== */
const titles = {home:'Accueil', youtube:'YouTube', molotov:'Molotov TV', m3u:'Mes playlists', guide:'Guide TV', sources:'Réglages'};
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=> switchView(el.dataset.view));
  el.addEventListener('keydown', e=>{ if(e.key==='Enter') switchView(el.dataset.view); });
});
function switchView(v){
  state.view = v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===v));
  document.getElementById('viewTitle').textContent = titles[v];
  render();
}

/* ===================== CLOCK ===================== */
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock,1000); tickClock();

/* ===================== RENDER ROUTER ===================== */
const viewEl = document.getElementById('view');
function updateMiniPreview(){
  const box = document.getElementById('sidebarMiniPreview');
  if(!box) return;
  const last = state.history[0];
  if(!last){ box.style.display = 'none'; return; }
  box.style.display = 'flex';
  document.getElementById('miniPreviewTitle').textContent = last.title;
  const thumb = document.getElementById('miniPreviewThumb');
  thumb.style.backgroundImage = last.id ? `url('https://img.youtube.com/vi/${last.id}/default.jpg')` : '';
  box.onclick = () => playItem(last);
}

function render(){
  if(state.view==='home') renderHome();
  else if(state.view==='youtube') renderYoutube();
  else if(state.view==='molotov') renderMolotov();
  else if(state.view==='m3u') renderM3u();
  else if(state.view==='guide') renderGuide();
  else if(state.view==='sources') renderSources();
  attachFocusNav();
  updateMiniPreview();
}

function tileHTML({title, sub, badge, thumb, onclickAttr}){
  return `<div class="tile" tabindex="0" ${onclickAttr}>
    ${thumb?`<div class="thumb" style="background-image:url('${thumb}')"></div>`:''}
    <div class="scrim"></div>
    ${badge?`<div class="tile-badge">${badge}</div>`:''}
    <div class="tile-body">
      <div class="tile-title">${title}</div>
      ${sub?`<div class="tile-sub">${sub}</div>`:''}
    </div>
  </div>`;
}

/* ===================== HOME ===================== */
function renderHome(){
  const recent = state.history;
  const lastWatched = recent[0];
  viewEl.innerHTML = `
    <div class="hero hero-netflix">
      <div>
        <div class="tag">Votre hub personnel</div>
        <h1>Toutes vos sources, un seul écran</h1>
        <p>YouTube, Molotov TV, le Guide TV et vos playlists M3U personnelles, réunis dans une interface façon Netflix. Configurez vos accès dans l'onglet <strong>Réglages</strong>.</p>
        <div class="hero-actions">
          ${lastWatched ? `<button class="hero-btn hero-btn-primary" id="heroPlay">▶ Lecture</button>` : ''}
          <button class="hero-btn hero-btn-secondary" id="heroInfo">⚙ Réglages</button>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="row-title">Reprendre la lecture</div>
      <div class="tiles" id="recentRow">
        ${recent.length? recent.map(r=>tileHTML({title:r.title, sub:r.source, badge:r.source, onclickAttr:`data-play='${encodeURIComponent(JSON.stringify(r))}'`})).join(''): '<div class="empty">Rien pour l\'instant — lancez une chaîne ou une vidéo.</div>'}
      </div>
    </div>
    <div class="row">
      <div class="row-title">Accès rapide</div>
      <div class="tiles">
        ${tileHTML({title:'YouTube', sub:'Chaînes & vidéos', onclickAttr:`data-nav="youtube"`})}
        ${tileHTML({title:'Molotov TV', sub:'TV en direct', onclickAttr:`data-nav="molotov"`})}
        ${tileHTML({title:'Guide TV', sub:'Programme en direct', onclickAttr:`data-nav="guide"`})}
        ${tileHTML({title:'Mes playlists', sub:'Playlist M3U personnelle', onclickAttr:`data-nav="m3u"`})}
      </div>
    </div>`;
  viewEl.querySelectorAll('[data-nav]').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.nav)));
  viewEl.querySelectorAll('[data-play]').forEach(t=>t.addEventListener('click',()=>{
    const item = JSON.parse(decodeURIComponent(t.dataset.play));

function extractYouTubeId(input){
  input = input.trim();
  const patterns = [
    /(?:v=|\/videos\/|embed\/|youtu\.be\/|\/live\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/
  ];
  for(const p of patterns){ const m = input.match(p); if(m) return m[1]; }
  return null;
}
let gAccessToken = null;
let gTokenClient = null;
let ytChannelView = null;

function ensureGoogleAuth(){
  if(!state.googleClientId){ alert('Configure ton Client ID Google dans Réglages → Comptes & API.'); switchView('sources'); return false; }
  if(!window.google || !google.accounts){ alert('La librairie Google est encore en train de charger, réessaie dans une seconde.'); return false; }
  if(!gTokenClient){
    gTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.googleClientId,
      scope: 'https://www.googleapis.com/auth/youtube.readonly',
      callback: (resp)=>{
        if(resp.error){ alert('Connexion Google refusée ou échouée : '+resp.error); return; }
        gAccessToken = resp.access_token;
        fetchSubscriptions();
      }
    });
  }
  return true;
}
function connectGoogle(){
  if(!ensureGoogleAuth()) return;
  gTokenClient.requestAccessToken();
}
async function fetchSubscriptions(){
  const statusEl = document.getElementById('ytAuthStatus');
  if(statusEl) statusEl.textContent = 'Chargement de tes abonnements...';
  try{
    const res = await fetch('https://www.googleapis.com/youtube/v3/subscriptions?part=snippet&mine=true&maxResults=50&order=alphabetical', {
      headers:{ 'Authorization': 'Bearer '+gAccessToken }
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    state.subscriptions = (data.items||[]).map(it=>({
      channelId: it.snippet.resourceId.channelId,
      title: it.snippet.title,
      thumb: it.snippet.thumbnails?.medium?.url || it.snippet.thumbnails?.default?.url
    }));
    ytChannelView = null;
    renderYoutube(); attachFocusNav();
  }catch(e){
    if(statusEl) statusEl.textContent = "Échec : "+e.message;
  }
}
async function openChannelUploads(channelId, title){
  ytChannelView = {channelId, title, videos: null};
  renderYoutube(); attachFocusNav();
  try{
    const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${channelId}`, {
      headers:{ 'Authorization': 'Bearer '+gAccessToken }
    });
    const chData = await chRes.json();
    const uploadsId = chData.items?.[0]?.contentDetails?.relatedPlaylists?.uploads;
    if(!uploadsId) throw new Error('Playlist des vidéos introuvable.');
    const plRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=24&playlistId=${uploadsId}`, {
      headers:{ 'Authorization': 'Bearer '+gAccessToken }
    });
    const plData = await plRes.json();
    const videos = (plData.items||[]).map(it=>({
      id: it.snippet.resourceId.videoId,
      title: it.snippet.title,
      thumb: it.snippet.thumbnails?.medium?.url
    }));
    ytChannelView = {channelId, title, videos};
    renderYoutube(); attachFocusNav();
  }catch(e){
    ytChannelView = {channelId, title, videos: [], error: e.message};
    renderYoutube(); attachFocusNav();
  }
}

/* ===================== GUIDE TV (EPG / XMLTV) ===================== */
let guideData = null;
let guideLoading = false;
let guideError = null;

function parseXmltvDate(str){
  const m = str.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?$/);
  if(!m) return null;
  const [, y, mo, d, h, mi, s, tz] = m;
  let iso = `${y}-${mo}-${d}T${h}:${mi}:${s}`;
  if(tz) iso += tz.slice(0,3)+':'+tz.slice(3);
  else iso += 'Z';
  return new Date(iso);
}

async function fetchGuideText(url){
  const isGzip = /\.gz(\?|$)/i.test(url);
  const isZip = /\.zip(\?|$)/i.test(url);
  async function tryFetch(targetUrl){
    const res = await fetch(targetUrl);
    if(!res.ok) throw new Error(`Le serveur a répondu avec le statut ${res.status}.`);
    if(isZip){
      const buf = await res.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      const xmlFile = Object.values(zip.files).find(f => !f.dir && /\.xml$/i.test(f.name));
      if(!xmlFile) throw new Error('Aucun fichier .xml trouvé dans l\'archive .zip.');
      return xmlFile.async('string');
    }
    if(isGzip){
      const buf = await res.arrayBuffer();
      return pako.ungzip(new Uint8Array(buf), {to:'string'});
    }
    return res.text();
  }
  try{
    return await tryFetch(url);
  }catch(networkErr){
    const proxy = (state.proxy||'').trim();
    if(!proxy) throw networkErr;
    const proxied = proxy.endsWith('=')||proxy.endsWith('/') ? proxy+encodeURIComponent(url) : (()=>{ const p=new URL(proxy); p.searchParams.set('url', url); return p.toString(); })();
    return await tryFetch(proxied);
  }
}

async function loadGuideData(){
  guideLoading = true; guideError = null;
  renderGuide();
  try{
    const url = state.epgUrl;
    if(!url) throw new Error('Aucune source EPG configurée (Réglages → Guide TV).');
    const text = await fetchGuideText(url);
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.querySelector('parsererror')) throw new Error('Le fichier XMLTV reçu est invalide.');

    const channels = Array.from(doc.querySelectorAll('channel')).map(ch=>({
      id: ch.getAttribute('id'),
      name: ch.querySelector('display-name')?.textContent || ch.getAttribute('id')
    }));

    const programmes = new Map();
    const now = new Date();
    Array.from(doc.querySelectorAll('programme')).forEach(p=>{
      const chId = p.getAttribute('channel');
      const start = parseXmltvDate(p.getAttribute('start'));
      const stop = parseXmltvDate(p.getAttribute('stop'));
      if(!start || !stop) return;
      if(stop < now || start > new Date(now.getTime()+24*3600*1000)) return;
      if(!programmes.has(chId)) programmes.set(chId, []);
      programmes.get(chId).push({
        start, stop,
        title: p.querySelector('title')?.textContent || 'Sans titre',
        desc: p.querySelector('desc')?.textContent || ''
      });
    });
    programmes.forEach(list => list.sort((a,b)=>a.start-b.start));

    guideData = { channels, programmes };
  }catch(e){
    guideError = e.message;
  }
  guideLoading = false;
  renderGuide();
  attachFocusNav();
}

let proxyWarmed = false;
function pingProxyWakeup(){
  const proxy = (state.proxy||'').trim();
  if(!proxy || proxyWarmed) return;
  proxyWarmed = true;
  fetch(proxy).catch(()=>{});
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const channels = [];
  let cur = null;
  for(const line of lines){
    if(line.startsWith('#EXTINF')){
      const nameMatch = line.split(',').pop();
      const logo = (line.match(/tvg-logo="([^"]+)"/)||[])[1];
      const group = (line.match(/group-title="([^"]+)"/)||[])[1];
      cur = { name: nameMatch?.trim() || 'Chaîne', logo, group };
    } else if(line && !line.startsWith('#')){
      if(cur){ cur.url = line.trim(); channels.push(cur); cur=null; }
    }
  }
  return channels;
}

      ${settingsTabs.map(t=>`<div class="subtab ${state.settingsTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('')}
    </div>
    <div id="settingsBody"></div>
  `;
  document.querySelectorAll('#settingsSubtabs .subtab').forEach(s=>s.addEventListener('click',()=>renderSources(s.dataset.tab)));
  const body = document.getElementById('settingsBody');
  if(state.settingsTab==='general') body.innerHTML = settingsGeneralPanel();
  if(state.settingsTab==='comptes') body.innerHTML = settingsComptesPanel();
  if(state.settingsTab==='reseau') body.innerHTML = settingsReseauPanel();
  if(state.settingsTab==='guide') body.innerHTML = settingsGuidePanel();
  bindSettingsEvents();
}

/* ===================== PLAYER (vue intégrée plein écran) ===================== */
let hlsInstance = null;
let mpegtsInstance = null;
let playerData = null;
let previousView = 'home';

function openVideoPlayer(title, url, sub, forceProxy){
  if(!url){ alert('URL de flux introuvable.'); return; }
  playerData = {title, sub: sub||'', kind:'video', src:url, forceProxy: !!forceProxy};
  goToPlayerView();
}
function openFramePlayer(title, url, sub){
  playerData = {title, sub: sub||'', kind:'iframe', src:url};
  goToPlayerView();
}
function goToPlayerView(){
  if(state.view !== 'player') previousView = state.view;
  state.view = 'player';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('viewTitle').textContent = 'Lecture';
  renderPlayerView();
  attachFocusNav();
}
function backFromPlayer(){
  if(hlsInstance){ hlsInstance.destroy(); hlsInstance=null; }
  if(mpegtsInstance){ mpegtsInstance.destroy(); mpegtsInstance=null; }
  clearInterval(window.__streamhubStallWatch);
  playerData = null;
  switchView(previousView);
}
function renderPlayerView(){
  const p = playerData;
  viewEl.innerHTML = `
    <div class="player-page">
      <div class="player-info">
        <div style="display:flex;align-items:center;">
          <button class="player-back" id="playerBackBtn">← Retour</button>
          <div>
            <h2>${p.title}</h2>
            ${p.sub? `<div class="sub">${p.sub}</div>`:''}
          </div>
        </div>
      </div>
      <div class="player-stage" id="playerStage"></div>
      <div class="player-status-line" id="playerStatusLine">${p.kind==='video' ? 'Chargement du flux...' : ''}</div>
      <div class="player-status-line" style="opacity:.5;word-break:break-all;">URL : ${p.src}</div>
    </div>`;
  document.getElementById('playerBackBtn').addEventListener('click', backFromPlayer);

  const stage = document.getElementById('playerStage');
  if(hlsInstance){ hlsInstance.destroy(); hlsInstance=null; }

  if(p.kind === 'iframe'){
    const frame = document.createElement('iframe');
    frame.src = p.src;
    frame.allow = 'autoplay; encrypted-media';
    frame.allowFullscreen = true;
    stage.appendChild(frame);
    return;
  }

  const video = document.createElement('video');
  video.id = 'videoPlayer';
  video.controls = true;
  video.autoplay = true;
  stage.appendChild(video);
  loadVideoSource(video, p.src, !!p.forceProxy);
}

function loadVideoSource(video, url, viaProxy){
  const statusEl = document.getElementById('playerStatusLine');
  const isDirectFile = /\.(mp4|webm|ogg)(\?|$)/i.test(url);
  const actualUrl = viaProxy ? buildProxiedUrl(url) : url;

  if(hlsInstance){ hlsInstance.destroy(); hlsInstance=null; }
  if(mpegtsInstance){ mpegtsInstance.destroy(); mpegtsInstance=null; }

  let settled = false;
  const timeout = setTimeout(()=>{
    if(!settled && statusEl) showRetryOptions(video, url, 'Le flux met trop de temps à démarrer (CORS probable ou serveur injoignable).');
  }, 9000);

  video.onerror = ()=>{
    clearTimeout(timeout);
    if(!settled) showRetryOptions(video, url, "Format non lisible directement par le navigateur, ou flux inaccessible.");
  };
  video.oncanplay = ()=>{ settled = true; clearTimeout(timeout); if(statusEl) statusEl.textContent=''; };

  if(!isDirectFile && window.Hls && Hls.isSupported()){
    hlsInstance = new Hls();
    hlsInstance.loadSource(actualUrl);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, ()=>{ settled = true; clearTimeout(timeout); if(statusEl) statusEl.textContent=''; });
    hlsInstance.on(Hls.Events.ERROR, (e,data)=>{
      if(data.fatal){
        clearTimeout(timeout);
        if(!settled) showRetryOptions(video, url, "Impossible de charger ce flux avec HLS.js (CORS, ou format non standard) : "+data.details);
      }
    });
  } else {
    video.src = actualUrl;
    video.play().catch(()=>{});
  }
}

function buildProxiedUrl(url){
  const proxy = (state.proxy||'').trim();
  if(!proxy) return url;
  if(proxy.endsWith('=') || proxy.endsWith('/')) return proxy + encodeURIComponent(url);
  const p = new URL(proxy);
  p.searchParams.set('url', url);
  return p.toString();
}

function showRetryOptions(video, originalUrl, message){
  const statusEl = document.getElementById('playerStatusLine');
  if(!statusEl) return;
  const hasProxy = !!(state.proxy||'').trim();
  statusEl.innerHTML = `
    <span style="color:var(--danger);">${message}</span>
    ${hasProxy ? ` — <button class="btn secondary" id="retryProxyBtn" style="padding:4px 10px;font-size:11px;margin-left:6px;">Réessayer via le proxy</button>` : ''}
  `;
  const retryBtn = document.getElementById('retryProxyBtn');
  if(retryBtn) retryBtn.addEventListener('click', ()=>{
    statusEl.textContent = 'Nouvel essai via le proxy...';
    loadVideoSource(video, originalUrl, true);
  });
}
function playItem(item){
  if(item.type==='youtube') openFramePlayer(item.title, `https://www.youtube.com/embed/${item.id}?autoplay=1`, item.source);
  else openVideoPlayer(item.title, item.url, item.source);
}

/* ===================== D-PAD / KEYBOARD NAVIGATION ===================== */
function attachFocusNav(){
  const focusables = Array.from(document.querySelectorAll('.tile, .nav-item, .subtab, input, .btn, select'));
  focusables.forEach(el=>{
    el.addEventListener('mouseenter', ()=> setFocus(el));
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') el.click(); });
  });
  if(!document.activeElement || document.activeElement===document.body){
    const first = document.querySelector('.view .tile, .view .btn');
    if(first) setFocus(first);
  }
}
function setFocus(el){
  document.querySelectorAll('.focused').forEach(f=>f.classList.remove('focused'));
  el.classList.add('focused');
  el.focus({preventScroll:false});
  el.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
}
function spatialNav(dir){
  const current = document.querySelector('.focused') || document.activeElement;
  const candidates = Array.from(document.querySelectorAll('.tile, .nav-item, .subtab, input, .btn'))
    .filter(el => el.offsetParent !== null);
  if(!current || !candidates.length) return;
  const cRect = current.getBoundingClientRect();
  const cx = cRect.left + cRect.width/2, cy = cRect.top + cRect.height/2;
  let best = null, bestScore = Infinity;
  for(const el of candidates){
    if(el === current) continue;
    const r = el.getBoundingClientRect();
    const ex = r.left + r.width/2, ey = r.top + r.height/2;
    const dx = ex - cx, dy = ey - cy;
    let primary, ortho;
    if(dir==='right'){ if(dx<=4) continue; primary=dx; ortho=Math.abs(dy); }
    else if(dir==='left'){ if(dx>=-4) continue; primary=-dx; ortho=Math.abs(dy); }
    else if(dir==='down'){ if(dy<=4) continue; primary=dy; ortho=Math.abs(dx); }
    else if(dir==='up'){ if(dy>=-4) continue; primary=-dy; ortho=Math.abs(dx); }
    const score = primary + ortho*2.2;
    if(score < bestScore){ bestScore = score; best = el; }
  }
  if(best) setFocus(best);
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(state.view==='player') backFromPlayer(); return; }
  const tag = document.activeElement?.tagName;
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    spatialNav({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]);
  }
});

/* ===================== GLOBAL SEARCH (simple filter across loaded sources) ===================== */
document.getElementById('globalSearch').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.tile .tile-title').forEach(t=>{
    const tile = t.closest('.tile');
    if(!tile) return;
    tile.style.display = t.textContent.toLowerCase().includes(q) ? '' : (q? 'none':'');
  });
});

pingProxyWakeup();
render();
</script>
