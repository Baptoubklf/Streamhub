<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamHub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

<style>
:root{
  --bg:#0A1628;
  --surface:#0F1F38;
  --surface2:#16294A;
  --amber:#00AEEF;
  --teal:#F5F5F1;
  --text:#F5F5F1;
  --muted:#8FA3C2;
  --danger:#FF6161;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;
}
h1,h2,h3,.brand,.tile-title,.nav-label{
  font-family:'Space Grotesk','Inter',sans-serif;
}
/* ===== Layout ===== */
.app{display:flex;height:100vh;width:100vw;}
.sidebar{
  width:220px;
  background:linear-gradient(180deg,#0C1930,#0A1628);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;align-items:stretch;
  padding:22px 0;
  flex-shrink:0;
  z-index:20;
}
.brand{
  color:var(--amber);
  font-weight:700;
  font-size:20px;
  letter-spacing:.5px;
  margin-bottom:24px;
  white-space:nowrap;
  overflow:hidden;
  width:100%;
  text-align:left;
  padding-left:22px;
}
.nav-item{
  width:100%;
  display:flex;align-items:center;gap:14px;
  padding:12px 0 12px 28px;
  color:var(--muted);
  cursor:pointer;
  position:relative;
  white-space:nowrap;
  overflow:hidden;
}
.nav-item svg{flex-shrink:0;width:20px;height:20px;}
.nav-label{opacity:1;font-size:14px;font-weight:600;}
.nav-item.active{color:var(--amber);background:rgba(0,174,239,0.12);}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);
}
.nav-group-label{
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:#4A6488;padding:16px 0 6px 28px;
}
.nav-group-label:first-of-type{padding-top:0px;}
.sidebar-spacer{flex:1;}
.sidebar-mini-preview{
  margin:0 16px 18px;padding:10px;border-radius:10px;background:var(--surface2);
  display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid rgba(255,255,255,.06);
}
.sidebar-mini-preview:hover{background:#1c355c;}
.mini-preview-thumb{
  width:46px;height:46px;border-radius:6px;background-size:cover;background-position:center;
  background-color:#0A1628;flex-shrink:0;
}
.mini-preview-info{overflow:hidden;}
.mini-preview-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.mini-preview-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item:focus-visible, .tile:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--teal);outline-offset:2px;
}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:64px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(180deg,rgba(10,14,20,.9),rgba(10,14,20,0));
}
.topbar h2{font-size:20px;font-weight:600;}
.clock{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}
.view{flex:1;overflow-y:auto;padding:8px 32px 40px;}
.view::-webkit-scrollbar{width:8px;}
.view::-webkit-scrollbar-thumb{background:#252c37;border-radius:4px;}

/* ===== Rows / tiles ===== */
.row{margin-bottom:34px;}
.row-title{font-size:16px;font-weight:600;margin-bottom:14px;color:#C9D2DC;display:flex;justify-content:space-between;align-items:center;}
.tiles{display:flex;gap:16px;overflow-x:auto;padding:8px 2px 14px;}
.tiles::-webkit-scrollbar{height:6px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}

.tile{
  position:relative;
  flex:0 0 200px;
  height:120px;
  border-radius:10px;
  background:var(--surface2);
  cursor:pointer;
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;
  transition:transform .18s ease;
  border:2px solid transparent;
}
.grid .tile{flex:none;width:100%;}
.tile:hover, .tile.focused{
  transform:scale(1.06);
  z-index:2;
  border-color:var(--amber);
  box-shadow:0 0 0 3px rgba(0,174,239,.35), 0 10px 24px rgba(0,0,0,.5);
}
.tile.focused::after{
  content:'';position:absolute;inset:-6px;border-radius:14px;
  background:conic-gradient(from 0deg, var(--amber), transparent 30%, transparent 70%, var(--amber));
  z-index:-1;
  animation:dial 2.4s linear infinite;
  opacity:.55;
}
@keyframes dial{to{transform:rotate(360deg);}}
.tile .thumb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.85;}
.tile .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.85));}
.tile-body{position:relative;padding:10px 12px;z-index:1;}
.tile-title{font-size:13px;font-weight:600;line-height:1.25;}
.tile-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.tile-epg{font-size:10px;color:var(--amber);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-badge{
  position:absolute;top:8px;right:8px;z-index:2;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,.55);color:var(--teal);letter-spacing:.5px;
}

/* ===== Hero ===== */
.hero{
  height:260px;border-radius:14px;position:relative;overflow:hidden;margin-bottom:32px;
  background:radial-gradient(circle at 20% 20%, #1c2431, #0A0E14 70%);
  display:flex;align-items:flex-end;padding:28px;
  border:1px solid rgba(255,255,255,.05);
}
.hero-netflix{
  height:300px;
  background:
    linear-gradient(180deg, rgba(10,10,10,0) 40%, rgba(10,10,10,1) 100%),
    radial-gradient(circle at 15% 25%, rgba(0,174,239,.35), transparent 55%),
    linear-gradient(135deg, #1a1a1a, #0A0A0A 70%);
  border:none;
}
.hero-actions{display:flex;gap:12px;margin-top:18px;}
.hero-btn{
  border:none;border-radius:6px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.hero-btn-primary{background:#fff;color:#000;}
.hero-btn-primary:hover{background:rgba(255,255,255,.85);}
.hero-btn-secondary{background:rgba(109,109,110,.5);color:#fff;}
.hero-btn-secondary:hover{background:rgba(109,109,110,.35);}
.hero h1{font-size:30px;margin-bottom:8px;}
.hero p{color:var(--muted);max-width:520px;font-size:14px;line-height:1.5;}
.hero .tag{color:var(--amber);font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:10px;text-transform:uppercase;}

/* ===== Forms & Categories ===== */
.panel{background:var(--surface);border-radius:12px;padding:24px;margin-bottom:24px;border:1px solid rgba(255,255,255,.05);}
.panel h3{font-size:15px;margin-bottom:16px;color:var(--amber);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a3340;
  background:#0D1218;color:var(--text);font-size:14px;font-family:inherit;
}
.field textarea{min-height:90px;resize:vertical;}
.row-inline{display:flex;gap:12px;}
.row-inline .field{flex:1;}
.btn{
  background:var(--amber);color:#FFFFFF;border:none;padding:10px 18px;border-radius:8px;
  font-weight:700;cursor:pointer;font-size:13px;letter-spacing:.3px;
}
.btn.secondary{background:transparent;border:1px solid #2a3340;color:var(--text);}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.btn:hover{filter:brightness(1.1);}

.subtabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.subtab{
  padding:8px 16px;border-radius:20px;background:var(--surface2);color:var(--muted);
  font-size:13px;cursor:pointer;font-weight:600;
}
.subtab.active{background:var(--amber);color:#FFFFFF;}

.cat-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:20px;}
.cat-chip{
  padding:6px 14px;border-radius:16px;background:rgba(255,255,255,0.05);color:var(--muted);
  font-size:12px;cursor:pointer;white-space:nowrap;border:1px solid transparent;
}
.cat-chip.active{background:rgba(0,174,239,0.2);color:var(--amber);border-color:var(--amber);}

.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px;padding:10px 12px;background:rgba(255,255,255,.03);border-left:3px solid var(--teal);border-radius:4px;}
.empty{color:var(--muted);font-size:13px;padding:20px 0;}

.search-bar{
  display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:20px;padding:8px 16px;width:260px;
}
.search-bar input{background:transparent;border:none;color:var(--text);font-size:13px;width:100%;outline:none;}

/* ===== Settings Layout ===== */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:20px;}

/* ===== Player Page ===== */
.player-page{display:flex;flex-direction:column;height:100%;}
.player-stage{
  flex:1;background:#000;border-radius:14px;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;min-height:0;
}
.player-stage video, .player-stage iframe{width:100%;height:100%;border:none;background:#000;}
.player-info{padding:18px 4px 6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.player-info h2{font-size:18px;font-weight:600;}
.player-info .sub{color:var(--muted);font-size:13px;margin-top:2px;}
.player-back{
  background:var(--surface2);border:none;color:var(--text);padding:10px 18px;border-radius:8px;
  cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;flex-shrink:0;margin-right:16px;
}
.player-back:hover{background:#232b37;}
.player-status-line{color:var(--muted);font-size:12px;margin-top:8px;}
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">📺 StreamHub</div>

    <!-- GROUPE 1: EN DIRECT & GUIDE -->
    <div class="nav-group-label">Direct & Guide</div>
    <div class="nav-item active" data-view="home" tabindex="0">

    <!-- GROUPE 2: CATALOGUE & MÉDIAS -->

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>

    </div>
    <div class="nav-item" data-view="molotov" tabindex="0">

        <div class="clock" id="clock">--:--</div>

<script>
/* ===================== HELPER FR FILTER ===================== */
function isFrenchContent(name, category) {
  const text = `${name || ''} ${category || ''}`.toUpperCase();
  // Exclusion si explicitement un autre pays
  if (/(?:\||\b)(?:EN|UK|US|ES|IT|DE|AR|PT|NL|TR|RO|PL|AL|RU)(?:\||\b)/.test(text) && !/(?:\||\b)(?:FR|FRENCH|FRANCE)(?:\||\b)/.test(text)) {
    return false;
  }
  // Inclusion des mots-clés FR courants
  return /(?:\||\b)(?:FR|FRENCH|FRANCE|VF|VOSTFR)(?:\||\b)/i.test(text) || !/(?:\||\b)[A-Z]{2,3}(?:\||\b)/.test(text);
}

/* ===================== ESCAPE HTML ===================== */
function escapeHTML(str){
  return String(str || '').replace(/[&<>"']/g, match => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[match]));
}

/* ===================== STORAGE ===================== */
const DB = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem('sh_'+k)) ?? d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem('sh_'+k, JSON.stringify(v)); }
};
let state = {
  youtube: DB.get('youtube', []),
  m3u: DB.get('m3u', {url:'', raw:'', channels:[]}),
  xtream: DB.get('xtream', {server:'',username:'',password:'',categories:[],streams:[], vod:[], vodCats:[], series:[], seriesCats:[]}),
  stalker: DB.get('stalker', {portal:'',mac:'',channels:[]}),
  history: DB.get('history', []),
  proxy: DB.get('proxy', 'https://STREAMHUB--5494c6567b9011f18e851607ee4eb77e.web.val.run'),
  googleClientId: DB.get('googleClientId', ''),
  youtubeApiKey: DB.get('youtubeApiKey', ''),
  epgUrl: DB.get('epgUrl', 'https://xmltvfr.fr/xmltv/xmltv_fr.xml.gz'),
  view: 'home',
};

function save(){
  DB.set('youtube', state.youtube);
  DB.set('m3u', state.m3u);
  DB.set('xtream', state.xtream);
  DB.set('stalker', state.stalker);
  DB.set('history', state.history);
  DB.set('proxy', state.proxy);
  DB.set('googleClientId', state.googleClientId);
  DB.set('youtubeApiKey', state.youtubeApiKey);
  DB.set('epgUrl', state.epgUrl);
}

function pushHistory(item){
  state.history.unshift({...item, ts:Date.now()});
  state.history = state.history.slice(0,20);
  save();
  if(typeof updateMiniPreview === 'function') updateMiniPreview();
}

/* ===================== NAV ===================== */
const titles = {
  home: 'À la une',
  guide: 'Guide TV (EPG)',
  iptv: 'IPTV, VOD & Séries',
  youtube: 'YouTube',
  molotov: 'Molotov TV',
  sources: 'Réglages',
  player: 'Lecture'
};

document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=> switchView(el.dataset.view));
  el.addEventListener('keydown', e=>{ if(e.key==='Enter') switchView(el.dataset.view); });
});

function switchView(v){
  state.view = v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===v));
  document.getElementById('viewTitle').textContent = titles[v] || 'StreamHub';
  render();
}

/* ===================== CLOCK ===================== */
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock,1000); tickClock();

/* ===================== RENDER ROUTER ===================== */
const viewEl = document.getElementById('view');
function updateMiniPreview(){
  const box = document.getElementById('sidebarMiniPreview');
  if(!box) return;
  const last = state.history[0];
  if(!last){ box.style.display = 'none'; return; }
  box.style.display = 'flex';
  document.getElementById('miniPreviewTitle').textContent = last.title;
  const thumb = document.getElementById('miniPreviewThumb');
  thumb.style.backgroundImage = last.id ? `url('https://img.youtube.com/vi/${last.id}/default.jpg')` : '';
  box.onclick = () => playItem(last);
}

function render(){
  if(state.view==='home') renderHome();
  else if(state.view==='youtube') renderYoutube();
  else if(state.view==='molotov') renderMolotov();
  else if(state.view==='iptv') renderIptv('live');
  else if(state.view==='guide') renderGuide();
  else if(state.view==='sources') renderSources();
  attachFocusNav();
  updateMiniPreview();
}

function tileHTML({title, sub, badge, thumb, epg, onclickAttr}){
  return `<div class="tile" tabindex="0" ${onclickAttr}>
    ${thumb?`<div class="thumb" style="background-image:url('${escapeHTML(thumb)}')"></div>`:''}
    <div class="scrim"></div>
    ${badge?`<div class="tile-badge">${escapeHTML(badge)}</div>`:''}
    <div class="tile-body">
      <div class="tile-title">${escapeHTML(title)}</div>
      ${sub?`<div class="tile-sub">${escapeHTML(sub)}</div>`:''}
      ${epg?`<div class="tile-epg">📺 ${escapeHTML(epg)}</div>`:''}
    </div>
  </div>`;
}

/* ===================== HOME ===================== */
function renderHome(){
  if(!guideData && !guideLoading && !guideError) loadGuideData();

  const recent = state.history;
  const lastWatched = recent[0];

  // Extraction de quelques programmes TV en direct pour l'accueil
  let liveTvNow = [];
  if (guideData && guideData.channels) {
    const now = new Date();
    liveTvNow = guideData.channels.map(ch => {
      const progs = guideData.programmes.get(ch.id) || [];
      const current = progs.find(p => p.start <= now && p.stop > now);
      const iptvMatch = findIptvMatchForEpg(ch.name, ch.id);
      if (current && iptvMatch) {
        return { channel: ch.name, title: current.title, match: iptvMatch };
      }
      return null;
    }).filter(Boolean).slice(0, 10);
  }

  viewEl.innerHTML = `
    <div class="hero hero-netflix">
      <div>
        <div class="tag">Vos médias en français</div>
        <h1>StreamHub TV</h1>
        <p>Toutes vos chaînes TV, films et séries VOD réunis en un seul endroit.</p>
        <div class="hero-actions">
          ${lastWatched ? `<button class="hero-btn hero-btn-primary" id="heroPlay">▶ Reprendre</button>` : ''}
          <button class="hero-btn hero-btn-secondary" id="heroGuide">📺 Guide TV</button>
        </div>
      </div>
    </div>

    <!-- NOUVELLE SECTION : TV EN DIRECT SUR L'ACCUEIL -->
    <div class="row">
      <div class="row-title">
        <span> En ce moment à la TV</span>
        <button class="btn secondary" style="padding:4px 10px;font-size:11px;" id="homeSeeAllEpg">Tout le guide</button>
      </div>
      <div class="tiles">
        ${liveTvNow.length ? liveTvNow.map(item => tileHTML({
            title: item.title,
            sub: item.channel,
            badge: 'DIRECT',
            onclickAttr: `data-play-guide="${encodeURIComponent(JSON.stringify(item.match))}"`
          })).join('') : `<div class="empty">${guideLoading ? 'Chargement des programmes...' : 'Aucun programme TV détecté ou EPG non chargé.'}</div>`
        }
      </div>
    </div>

    <div class="row">
      <div class="row-title">Récemment regardés</div>

/* ===================== GUIDE TV (EPG) ===================== */
let guideData = null; 
let guideLoading = false;
let guideError = null;

function parseXmltvDate(str){
  const m = str.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?$/);
  if(!m) return null;
  const [, y, mo, d, h, mi, s, tz] = m;
  let iso = `${y}-${mo}-${d}T${h}:${mi}:${s}`;
  if(tz) iso += tz.slice(0,3)+':'+tz.slice(3);
  else iso += 'Z';
  return new Date(iso);
}

function cleanChannelName(str){
  return (str || '').toLowerCase()
    .replace(/fhd|hd|sd|4k|1080p|fr|france|\|\s*fr/gi, '')
    .replace(/[^a-z0-9]/g, '')
    .trim();
}

async function fetchGuideText(url){
  const isGzip = /\.gz(\?|$)/i.test(url);
  const isZip = /\.zip(\?|$)/i.test(url);
  async function tryFetch(targetUrl){
    const res = await fetch(targetUrl);
    if(!res.ok) throw new Error(`Code erreur ${res.status}`);
    if(isZip){
      const buf = await res.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      const xmlFile = Object.values(zip.files).find(f => !f.dir && /\.xml$/i.test(f.name));
      return xmlFile.async('string');
    }
    if(isGzip){
      const buf = await res.arrayBuffer();
      return pako.ungzip(new Uint8Array(buf), {to:'string'});
    }
    return res.text();
  }
  try{ return await tryFetch(url); }
  catch(networkErr){
    const proxy = (state.proxy||'').trim();
    if(!proxy) throw networkErr;
    const proxied = proxy.endsWith('=')||proxy.endsWith('/') ? proxy+encodeURIComponent(url) : (()=>{ const p=new URL(proxy); p.searchParams.set('url', url); return p.toString(); })();
    return await tryFetch(proxied);
  }
}

async function loadGuideData(){
  if(guideLoading) return;
  guideLoading = true; guideError = null;
  try{
    const url = state.epgUrl;
    if(!url) throw new Error('Aucune URL EPG.');
    const text = await fetchGuideText(url);
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    
    const channels = Array.from(doc.querySelectorAll('channel')).map(ch=>({
      id: ch.getAttribute('id'),
      name: ch.querySelector('display-name')?.textContent || ch.getAttribute('id'),
      cleanName: cleanChannelName(ch.querySelector('display-name')?.textContent || ch.getAttribute('id'))
    }));

    const programmes = new Map();
    const now = new Date();
    Array.from(doc.querySelectorAll('programme')).forEach(p=>{
      const chId = p.getAttribute('channel');
      const start = parseXmltvDate(p.getAttribute('start'));
      const stop = parseXmltvDate(p.getAttribute('stop'));
      if(!start || !stop) return;
      if(stop < now || start > new Date(now.getTime()+24*3600*1000)) return;
      if(!programmes.has(chId)) programmes.set(chId, []);
      programmes.get(chId).push({ start, stop, title: p.querySelector('title')?.textContent || 'Sans titre' });
    });

    guideData = { channels, programmes };
  }catch(e){ guideError = e.message; }
  guideLoading = false;
  if(state.view === 'guide' || state.view === 'home') render();
}

function getCurrentEpgForChannel(channelName, tvgId){
  if(!guideData) return null;
  const now = new Date();
  const targetClean = cleanChannelName(channelName);
  const matchedCh = guideData.channels.find(c => (tvgId && c.id === tvgId) || (c.cleanName && c.cleanName === targetClean));
  if(!matchedCh) return null;
  const progs = guideData.programmes.get(matchedCh.id) || [];
  return progs.find(p => p.start <= now && p.stop > now);
}

function findIptvMatchForEpg(epgChannelName, epgId){
  const targetClean = cleanChannelName(epgChannelName);
  let m3uCh = (state.m3u.channels || []).find(c => (c.tvgId && c.tvgId === epgId) || cleanChannelName(c.name) === targetClean);
  if(m3uCh) return { title: m3uCh.name, source: 'M3U', type: 'hls', url: m3uCh.url };

  let xtCh = (state.xtream.streams || []).find(c => cleanChannelName(c.name) === targetClean);
  if(xtCh){
    const url = `${state.xtream.server}/live/${state.xtream.username}/${state.xtream.password}/${xtCh.id}.m3u8`;
    return { title: xtCh.name, source: 'Xtream', type: 'hls', url };
  }
  return null;
}

function fmtTime(d){ return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }

function renderGuide(){
  viewEl.innerHTML = `
    <div class="hero" style="height:160px;">
      <div>
        <div class="tag">Programme TV</div>
        <h1>Guide des chaînes</h1>
      </div>
    </div>
    ${guideLoading ? `<div class="empty">Chargement du guide TV...</div>` : ''}
    ${guideData ? `
      <div class="grid">
        ${guideData.channels.filter(ch => guideData.programmes.has(ch.id)).map(ch=>{
            const progs = guideData.programmes.get(ch.id);
            const now = new Date();
            const current = progs.find(p=>p.start<=now && p.stop>now);
            const iptvMatch = findIptvMatchForEpg(ch.name, ch.id);
            if(!current) return '';
            return `

              </div>`;
          }).join('')}
      </div>` : ''}
  `;

  viewEl.querySelectorAll('[data-play-guide]').forEach(t=>{
    t.addEventListener('click', ()=>{

async function syncXtream(){
  const server = document.getElementById('xServer').value.replace(/\/$/,'');
  const username = document.getElementById('xUser').value;
  const password = document.getElementById('xPass').value;
  const statusEl = document.getElementById('xStatus');
  statusEl.style.display='block'; statusEl.textContent = 'Connexion et chargement du contenu...';

  try {
    // Streams
    const liveRes = await proxied(`${server}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_live_streams`);
    const liveData = await liveRes.json();

    // VOD & Catégories VOD
    const vodRes = await proxied(`${server}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_vod_streams`);
    const vodData = await vodRes.json();
    const vodCatRes = await proxied(`${server}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_vod_categories`);
    const vodCats = await vodCatRes.json();

    // Séries & Catégories Séries
    const seriesRes = await proxied(`${server}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_series`);
    const seriesData = await seriesRes.json();
    const seriesCatRes = await proxied(`${server}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_series_categories`);
    const seriesCats = await seriesCatRes.json();

    state.xtream = {
      server, username, password,
      streams: Array.isArray(liveData)?liveData:[],
      vod: Array.isArray(vodData)?vodData:[],
      vodCats: Array.isArray(vodCats)?vodCats:[],
      series: Array.isArray(seriesData)?seriesData:[],
      seriesCats: Array.isArray(seriesCats)?seriesCats:[]
    };
    save();
    statusEl.textContent = 'Synchronisation Xtream réussie !';
  } catch(e) {
    statusEl.textContent = 'Erreur Xtream : ' + e.message;
  }
}

async function syncM3u(){
  const url = document.getElementById('m3uUrl').value;
  try{
    const res = await fetch(url);
    const text = await res.text();
    state.m3u = {url, raw:text, channels: parseM3U(text)};
    save(); alert('M3U chargé !');
  }catch(e){ alert('Erreur M3U : '+e.message); }
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const channels = [];
  let cur = null;
  for(const line of lines){
    if(line.startsWith('#EXTINF')){
      const nameMatch = line.split(',').pop();
      const logo = (line.match(/tvg-logo="([^"]+)"/)||[])[1];
      const tvgId = (line.match(/tvg-id="([^"]+)"/)||[])[1];
      const group = (line.match(/group-title="([^"]+)"/)||[])[1];
      cur = { name: nameMatch?.trim() || 'Chaîne', logo, group, tvgId };
    } else if(line && !line.startsWith('#')){
      if(cur){ cur.url = line.trim(); channels.push(cur); cur=null; }
    }
  }
  return channels;
}

function proxied(url){
  const proxy = (state.proxy || '').trim();
  if(!proxy) return fetch(url);
  if(proxy.endsWith('=') || proxy.endsWith('/')) return fetch(proxy + encodeURIComponent(url));
  const p = new URL(proxy);
  p.searchParams.set('url', url);
  return fetch(p.toString());
}

let hlsInstance = null;
function openVideoPlayer(title, url, sub){
  if(!url) return;
  state.view = 'player';
  renderPlayer(title, url, sub);
}

function renderPlayer(title, url, sub){
  viewEl.innerHTML = `
    <div class="player-page">
      <div class="player-info">
        <button class="player-back" id="playerBack">← Retour</button>
        <h2>${escapeHTML(title)}</h2>
      </div>
      <div class="player-stage">
        <video id="mainVideo" controls autoplay></video>
      </div>
    </div>`;
  
  document.getElementById('playerBack').onclick = () => switchView('home');
  const video = document.getElementById('mainVideo');
  if(Hls.isSupported()){
    hlsInstance = new Hls();
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(video);
  } else { video.src = url; }
}

function playItem(item){
  if(!item) return;
  openVideoPlayer(item.title, item.url, item.source);
  pushHistory(item);
}

function attachFocusNav(){

}
function setFocus(el){
  document.querySelectorAll('.focused').forEach(f=>f.classList.remove('focused'));

}
