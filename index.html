<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamHub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#0A1628;
  --surface:#0F1F38;
  --surface2:#16294A;
  --amber:#00AEEF;
  --teal:#F5F5F1;
  --text:#F5F5F1;
  --muted:#8FA3C2;
  --danger:#FF6161;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;
}
h1,h2,h3,.brand,.tile-title,.nav-label{
  font-family:'Space Grotesk','Inter',sans-serif;
}
.app{display:flex;height:100vh;width:100vw;}
.sidebar{
  width:220px;
  background:linear-gradient(180deg,#0C1930,#0A1628);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;align-items:stretch;
  padding:22px 0;
  flex-shrink:0;
  z-index:20;
}
.brand{
  color:var(--amber);
  font-weight:700;
  font-size:20px;
  letter-spacing:.5px;
  margin-bottom:24px;
  white-space:nowrap;
  overflow:hidden;
  width:100%;
  text-align:left;
  padding-left:22px;
}
.nav-item{
  width:100%;
  display:flex;align-items:center;gap:14px;
  padding:12px 0 12px 28px;
  color:var(--muted);
  cursor:pointer;
  position:relative;
  white-space:nowrap;
  overflow:hidden;
}
.nav-item svg{flex-shrink:0;width:20px;height:20px;}
.nav-label{opacity:1;font-size:14px;font-weight:600;}
.nav-item.active{color:var(--amber);background:rgba(0,174,239,0.12);}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);
}
.nav-group-label{
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:#4A6488;padding:16px 0 6px 28px;
}
.sidebar-spacer{flex:1;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:64px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(180deg,rgba(10,14,20,.9),rgba(10,14,20,0));
}
.topbar h2{font-size:20px;font-weight:600;}
.clock{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}
.view{flex:1;overflow-y:auto;padding:8px 32px 40px;}
.view::-webkit-scrollbar{width:8px;}
.view::-webkit-scrollbar-thumb{background:#252c37;border-radius:4px;}

.row{margin-bottom:34px;}
.row-title{font-size:16px;font-weight:600;margin-bottom:14px;color:#C9D2DC;display:flex;justify-content:space-between;align-items:center;}
.tiles{display:flex;gap:16px;overflow-x:auto;padding:8px 2px 14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}

.tile{
  position:relative;
  flex:0 0 200px;
  height:120px;
  border-radius:10px;
  background:var(--surface2);
  cursor:pointer;
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;
  transition:transform .18s ease;
  border:2px solid transparent;
}
.grid .tile{flex:none;width:100%;}
.tile:hover{
  transform:scale(1.05);
  border-color:var(--amber);
  box-shadow:0 10px 24px rgba(0,0,0,.5);
}
.tile .thumb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.85;}
.tile .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.85));}
.tile-body{position:relative;padding:10px 12px;z-index:1;}
.tile-title{font-size:13px;font-weight:600;line-height:1.25;}
.tile-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.tile-badge{
  position:absolute;top:8px;right:8px;z-index:2;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,.65);color:var(--teal);
}

.hero{
  height:220px;border-radius:14px;position:relative;overflow:hidden;margin-bottom:28px;
  background:linear-gradient(180deg, rgba(10,10,10,0) 40%, rgba(10,10,10,1) 100%), radial-gradient(circle at 15% 25%, rgba(0,174,239,.35), transparent 55%);
  display:flex;align-items:flex-end;padding:28px;
}
.hero-actions{display:flex;gap:12px;margin-top:14px;}
.hero-btn{
  border:none;border-radius:6px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;
}
.hero-btn-primary{background:#fff;color:#000;}
.hero-btn-secondary{background:rgba(109,109,110,.5);color:#fff;}

.panel{background:var(--surface);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid rgba(255,255,255,.05);}
.panel h3{font-size:15px;margin-bottom:14px;color:var(--amber);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.field input{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a3340;
  background:#0D1218;color:var(--text);font-size:14px;
}
.btn{
  background:var(--amber);color:#FFFFFF;border:none;padding:10px 18px;border-radius:8px;
  font-weight:700;cursor:pointer;font-size:13px;
}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}

.subtabs{display:flex;gap:8px;margin-bottom:20px;}
.subtab{
  padding:8px 16px;border-radius:20px;background:var(--surface2);color:var(--muted);
  font-size:13px;cursor:pointer;font-weight:600;
}
.subtab.active{background:var(--amber);color:#FFFFFF;}

.cat-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px;}
.cat-chip{
  padding:6px 14px;border-radius:16px;background:rgba(255,255,255,0.05);color:var(--muted);
  font-size:12px;cursor:pointer;white-space:nowrap;
}
.cat-chip.active{background:rgba(0,174,239,0.2);color:var(--amber);border:1px solid var(--amber);}

.empty{color:var(--muted);font-size:13px;padding:20px 0;}
.player-page{display:flex;flex-direction:column;height:100%;}
.player-stage{flex:1;background:#000;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.player-stage video{width:100%;height:100%;}
.player-back{background:var(--surface2);border:none;color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;margin-right:12px;}
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="brand">📺 StreamHub</div>
    <div class="nav-group-label">Direct & Guide</div>
    <div class="nav-item active" data-view="home"><span class="nav-label">À la une</span></div>
    <div class="nav-item" data-view="guide"><span class="nav-label">Guide TV (EPG)</span></div>

    <div class="nav-group-label">Catalogue</div>
    <div class="nav-item" data-view="iptv"><span class="nav-label">IPTV, VOD & Séries</span></div>
    <div class="nav-item" data-view="youtube"><span class="nav-label">YouTube</span></div>

    <div class="sidebar-spacer"></div>

    <div class="nav-group-label">Configuration</div>
    <div class="nav-item" data-view="sources"><span class="nav-label">Réglages</span></div>
  </nav>

  <div class="main">
    <div class="topbar">
      <h2 id="viewTitle">À la une</h2>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<script>
/* FILTRE FRANÇAIS ASSOUPLI POUR NE PAS BLOQUER VOD/SERIES SANS BALISES */
function isFrenchContent(name, category) {
  const text = `${name || ''} ${category || ''}`.toUpperCase();
  // Exclut uniquement les langues explicitement étrangères
  if (/(?:\||\b)(?:EN|UK|US|ES|IT|DE|AR|PT|NL|TR|RO|PL|AL|RU)(?:\||\b)/.test(text) && !/(?:\||\b)(?:FR|FRENCH|FRANCE)(?:\||\b)/.test(text)) {
    return false;
  }
  return true;
}

function escapeHTML(str){ return String(str || '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const DB = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem('sh_'+k)) ?? d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem('sh_'+k, JSON.stringify(v)); }
};

let state = {
  m3u: DB.get('m3u', {url:'', raw:'', channels:[]}),
  xtream: DB.get('xtream', {server:'',username:'',password:'',streams:[], vod:[], vodCats:[], series:[], seriesCats:[]}),
  stalker: DB.get('stalker', {portal:'',mac:'',channels:[]}),
  history: DB.get('history', []),
  proxy: DB.get('proxy', 'https://STREAMHUB--5494c6567b9011f18e851607ee4eb77e.web.val.run'),
  epgUrl: DB.get('epgUrl', 'https://xmltvfr.fr/xmltv/xmltv_fr.xml.gz'),
  view: 'home'
};

function save(){
  DB.set('m3u', state.m3u);
  DB.set('xtream', state.xtream);
  DB.set('stalker', state.stalker);
  DB.set('history', state.history);
  DB.set('proxy', state.proxy);
  DB.set('epgUrl', state.epgUrl);
}

function pushHistory(item){
  state.history = [item, ...state.history.filter(h=>h.title!==item.title)].slice(0,15);
  save();
}

document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=> switchView(el.dataset.view));
});

function switchView(v){
  state.view = v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===v));
  document.getElementById('viewTitle').textContent = v.toUpperCase();
  render();
}

function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock,1000); tickClock();

const viewEl = document.getElementById('view');

function render(){
  if(state.view==='home') renderHome();
  else if(state.view==='youtube') renderYoutube();
  else if(state.view==='iptv') renderIptv('live');
  else if(state.view==='guide') renderGuide();
  else if(state.view==='sources') renderSources();
}

function tileHTML({title, sub, badge, thumb, onclickAttr}){
  return `<div class="tile" ${onclickAttr}>
    ${thumb?`<div class="thumb" style="background-image:url('${escapeHTML(thumb)}')"></div>`:''}
    <div class="scrim"></div>
    ${badge?`<div class="tile-badge">${escapeHTML(badge)}</div>`:''}
    <div class="tile-body">
      <div class="tile-title">${escapeHTML(title)}</div>
      ${sub?`<div class="tile-sub">${escapeHTML(sub)}</div>`:''}
    </div>
  </div>`;
}

/* ACCUEIL AVEC TV + HISTORIQUE */
function renderHome(){
  const history = state.history;
  const stalkerChans = state.stalker.channels || [];

  viewEl.innerHTML = `
    <div class="hero">
      <div>
        <h1 style="font-size:28px;">StreamHub TV</h1>
        <p style="color:var(--muted);margin-top:6px;">Vos chaînes TV et VOD en direct</p>
      </div>
    </div>

    <div class="row">
      <div class="row-title"> En ce moment à la TV</div>
      <div class="tiles">
        ${stalkerChans.slice(0, 10).map(c=>tileHTML({
          title: c.name, sub: 'Stalker TV', badge: 'DIRECT', onclickAttr: `data-play-st="${c.name}"`
        })).join('') || '<div class="empty">Connectez votre abonnement dans Réglages.</div>'}
      </div>
    </div>

    <div class="row">
      <div class="row-title">Récemment regardés</div>
      <div class="tiles">
        ${history.length ? history.map(r=>tileHTML({
          title:r.title, sub:r.source, badge:r.source, onclickAttr:`data-play='${encodeURIComponent(JSON.stringify(r))}'`
        })).join('') : '<div class="empty">Aucun historique de lecture.</div>'}
      </div>
    </div>`;

  viewEl.querySelectorAll('[data-play]').forEach(t=>{
    t.addEventListener('click', ()=> playItem(JSON.parse(decodeURIComponent(t.dataset.play))));
  });
}

/* YOUTUBE INTÉGRÉ PAR RECHERCHE/TENDANCES */
function renderYoutube(){
  viewEl.innerHTML = `
    <div class="panel">
      <h3>🔍 Rechercher sur YouTube</h3>
      <div style="display:flex;gap:10px;">
        <input id="ytQuery" placeholder="Entrez un sujet ou une vidéo...">
        <button class="btn" id="ytSearchBtn">Chercher</button>
      </div>
    </div>
    <div id="ytResults" class="grid"></div>`;

  document.getElementById('ytSearchBtn')?.addEventListener('click', async ()=>{
    const q = document.getElementById('ytQuery').value;
    if(!q) return;
    const resEl = document.getElementById('ytResults');
    resEl.innerHTML = '<div class="empty">Recherche en cours...</div>';
    
    try {
      const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=all`);
      const data = await res.json();
      const items = data.items.filter(i=>i.type==='stream');
      resEl.innerHTML = items.map(item => tileHTML({
        title: item.title,
        sub: item.uploaderName,
        thumb: item.thumbnail,
        onclickAttr: `data-yt-id="${item.url.split('v=')[1]}" data-yt-title="${escapeHTML(item.title)}"`
      })).join('');

      resEl.querySelectorAll('[data-yt-id]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.ytId;
          const title = el.dataset.ytTitle;
          playItem({ title, source: 'YouTube', url: `https://www.youtube.com/embed/${id}?autoplay=1` });
        });
      });
    } catch(e) {
      resEl.innerHTML = '<div class="empty">Erreur de chargement des vidéos.</div>';
    }
  });
}

/* IPTV, VOD & SERIES */
let iptvSub = 'live';
function renderIptv(sub){
  iptvSub = sub || iptvSub;
  viewEl.innerHTML = `
    <div class="subtabs">
      <div class="subtab ${iptvSub==='live'?'active':''}" data-sub="live">📺 Chaînes TV</div>
      <div class="subtab ${iptvSub==='vod'?'active':''}" data-sub="vod">🎬 Films (VOD)</div>
      <div class="subtab ${iptvSub==='series'?'active':''}" data-sub="series">🍿 Séries</div>
    </div>
    <div id="iptvBody"></div>`;

  viewEl.querySelectorAll('.subtab').forEach(s=>s.addEventListener('click',()=>renderIptv(s.dataset.sub)));

  const body = document.getElementById('iptvBody');
  if(iptvSub==='live') {
    const chans = (state.stalker.channels || []).concat(state.m3u.channels || []);
    body.innerHTML = `<div class="grid">${chans.map(c=>tileHTML({title:c.name, sub:'Live', badge:'TV'})).join('') || '<div class="empty">Aucune chaîne trouvée.</div>'}</div>`;
  } else if(iptvSub==='vod') {
    const vods = state.xtream.vod || [];
    body.innerHTML = `<div class="grid">${vods.map(v=>tileHTML({title:v.name, sub:'VOD', thumb:v.stream_icon})).join('') || '<div class="empty">Aucun film VOD chargé via Xtream.</div>'}</div>`;
  } else {
    const series = state.xtream.series || [];
    body.innerHTML = `<div class="grid">${series.map(s=>tileHTML({title:s.name, sub:'Série', thumb:s.cover})).join('') || '<div class="empty">Aucune série chargée via Xtream.</div>'}</div>`;
  }
}

/* CONFIGURATION PROPRE ET CLAIRE */
function renderSources(){
  viewEl.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;">
      <div class="panel">
        <h3> Configuration Xtream</h3>
        <div class="field"><label>Serveur</label><input id="xServer" value="${escapeHTML(state.xtream.server||'')}"></div>
        <div class="field"><label>Identifiant</label><input id="xUser" value="${escapeHTML(state.xtream.username||'')}"></div>
        <div class="field"><label>Mot de passe</label><input id="xPass" type="password" value="${escapeHTML(state.xtream.password||'')}"></div>
        <button class="btn" id="xConnect">Synchroniser Xtream</button>
      </div>

      <div class="panel">
        <h3> Playlist M3U</h3>
        <div class="field"><label>URL Playlist</label><input id="m3uUrl" value="${escapeHTML(state.m3u.url||'')}"></div>
        <button class="btn" id="m3uLoad">Charger M3U</button>
      </div>
    </div>
    
    <div style="margin-top:20px;text-align:right;">
      <button class="btn danger" onclick="localStorage.clear();location.reload();">Réinitialiser l'application</button>
    </div>`;
}

function playItem(item){
  if(!item) return;
  pushHistory(item);
  state.view = 'player';
  viewEl.innerHTML = `
    <div class="player-page">
      <div style="display:flex;align-items:center;padding:12px 0;">
        <button class="player-back" onclick="switchView('home')">← Retour</button>
        <h2>${escapeHTML(item.title)}</h2>
      </div>
      <div class="player-stage">
        ${item.url.includes('youtube.com') 
          ? `<iframe src="${item.url}" style="width:100%;height:100%;border:none;" allow="autoplay"></iframe>`
          : `<video id="videoPlayer" controls autoplay></video>`
        }
      </div>
    </div>`;

  if(!item.url.includes('youtube.com')){
    const video = document.getElementById('videoPlayer');
    if(Hls.isSupported()){
      const hls = new Hls();
      hls.loadSource(item.url);
      hls.attachMedia(video);
    } else { video.src = item.url; }
  }
}

function renderGuide(){ viewEl.innerHTML = `<div class="empty">Guide TV chargé dans l'onglet principal.</div>`; }

render();
</script>
</body>
</html>
