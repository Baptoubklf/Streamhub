<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineTV - Interface Lecteur Média</title>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #151a23;
      --primary: #10b981; /* Vert type Xbox */
      --text: #f3f4f6;
      --muted: #9ca3af;
      --focus-glow: rgba(16, 185, 129, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ===== Sidebar (Menu Télécommande) ===== */
    .sidebar {
      width: 90px;
      background: rgba(21, 26, 35, 0.6);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      gap: 28px;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 10;
    }

    .brand-logo {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .nav-btn {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-btn:hover, .nav-btn:focus, .nav-btn.active {
      color: #fff;
      background: var(--surface);
      transform: scale(1.1);
      outline: 2px solid var(--primary);
    }

    /* ===== Zone Principale ===== */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      scroll-behavior: smooth;
    }

    /* En-tête / Hero Section */
    .hero {
      position: relative;
      height: 380px;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 40px;
      margin-bottom: 40px;
      background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(11,14,20,0.95) 100%),
                  url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hero-details {
      max-width: 550px;
    }

    .badge {
      display: inline-block;
      background: var(--primary);
      color: #000;
      font-weight: 700;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .hero h1 {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1.1;
    }

    .hero p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .action-btns {
      display: flex;
      gap: 14px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--text);
      color: #000;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      backdrop-filter: blur(10px);
    }

    .btn:focus, .btn:hover {
      transform: scale(1.05);
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--focus-glow);
      outline: none;
    }

    /* ===== Rangées de Cartes ===== */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .media-row {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 10px 4px 30px;
    }

    .media-row::-webkit-scrollbar {
      display: none;
    }

    .card {
      flex: 0 0 200px;
      height: 280px;
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      border: 2px solid transparent;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      position: absolute;
      bottom: 0;
      inset-x: 0;
      padding: 16px;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
    }

    .card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Focus Télécommande / Controlleur TV */
    .card:focus, .card:hover {
      transform: scale(1.1);
      border-color: var(--primary);
      box-shadow: 0 12px 24px rgba(0,0,0,0.6), 0 0 20px var(--focus-glow);
      outline: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <nav class="sidebar">
    <div class="brand-logo">▶</div>
    <button class="nav-btn active" tabindex="0" title="Accueil">🏠</button>
    <button class="nav-btn" tabindex="0" title="Recherche">🔍</button>
    <button class="nav-btn" tabindex="0" title="Bibliothèque">📁</button>
    <button class="nav-btn" tabindex="0" title="Paramètres">⚙️</button>
  </nav>

  <main class="main-content">

    <section class="hero">
      <div class="hero-details">
        <span class="badge">Nouveauté</span>
        <h1>Cyber Odyssey 2099</h1>
        <p>Un voyage visuel immersif à travers les mégapoles du futur. Découvrez un univers captivant en haute définition.</p>
        <div class="action-btns">
          <button class="btn btn-primary" tabindex="0">▶ Regarder</button>
          <button class="btn btn-secondary" tabindex="0">+ Ma Liste</button>
        </div>
      </div>
    </section>

    <h2 class="section-title">En tendance actuellement</h2>
    <div class="media-row">
      <div class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80" alt="Cover">
        <div class="card-info">
          <div class="card-title">Horizon Deep</div>
          <div class="card-sub">Sci-Fi • 2h 15m</div>
        </div>
      </div>

      <div class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=400&q=80" alt="Cover">
        <div class="card-info">
          <div class="card-title">Neon Chronicles</div>
          <div class="card-sub">Action • Saison 1</div>
        </div>
      </div>

      <div class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=400&q=80" alt="Cover">
        <div class="card-info">
          <div class="card-title">The Void</div>
          <div class="card-sub">Thriller • 1h 48m</div>
        </div>
      </div>

      <div class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?auto=format&fit=crop&w=400&q=80" alt="Cover">
        <div class="card-info">
          <div class="card-title">Astral Light</div>
          <div class="card-sub">Documentaire</div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Fait défiler automatiquement la ligne vers la carte sélectionnée avec les flèches du clavier
    document.querySelectorAll('[tabindex="0"]').forEach(element => {
      element.addEventListener('focus', () => {
        element.scrollIntoView({
          behavior: 'smooth',
          block: 'nearest',
          inline: 'center'
        });
      });
    });
  </script>
</body>
</html>
