<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamHub - Hub Multimédia & Stalker</title>
  
  <!-- Librairies de streaming CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>

  <style>
    :root {
      --bg-main: #0f0f12;
      --bg-card: #1a1a24;
      --bg-card-hover: #252535;
      --accent: #e50914;
      --text: #ffffff;
      --text-muted: #a0a0b0;
      --focus-ring: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    /* Navigation latérale */
    aside {
      width: 250px;
      background-color: #08080a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-right: 1px solid #222;
      flex-shrink: 0;
    }

    aside .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); letter-spacing: 1px; }
    aside nav { display: flex; flex-direction: column; gap: 8px; }
    
    .nav-item {
      display: block;
      padding: 12px 16px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s;
      outline: none;
      cursor: pointer;
    }

    .nav-item:hover, .nav-item.active { background-color: var(--bg-card); color: var(--text); }
    .nav-item:focus { border: 2px solid var(--focus-ring); background-color: var(--bg-card); color: var(--text); }

    /* Contenu principal */
    main { flex: 1; display: grid; grid-template-rows: 1fr 300px; padding: 20px; gap: 20px; overflow: hidden; }

    /* Zone lecteur vidéo */
    .player-container {
      background: #000;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    /* Overlay statut */
    .stream-status {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.75);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .status-dot { width: 8px; height: 8px; background: #00ff66; border-radius: 50%; }
    .status-dot.error { background: #ff3333; }
    .status-dot.connecting { background: #ffaa00; }

    /* Grille EPG & Catalogue */
    .epg-section {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .epg-header { display: flex; justify-content: space-between; align-items: center; }
    .epg-header h3 { font-size: 1.1rem; }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .channel-card {
      background: var(--bg-card-hover);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      outline: none;
    }

    .channel-card:hover, .channel-card.selected { border-color: var(--accent); }
    .channel-card:focus { border-color: var(--focus-ring); transform: scale(1.02); }
    .channel-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .channel-epg { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .btn-back {
      padding: 6px 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Navigation Latérale -->
  <aside>
    <div class="logo">StreamHub</div>
    <nav>
      <a class="nav-item active" id="tabTv" tabindex="0">📺 TV Démo</a>
      <a class="nav-item" id="tabMovies" tabindex="0">🎬 Films Stalker (VOD)</a>
      <a class="nav-item" id="tabSeries" tabindex="0">🍿 Séries Stalker</a>
      <a class="nav-item" id="tabConfig" tabindex="0">⚙️ Connexion Stalker</a>
    </nav>
  </aside>

  <!-- Zone Principale -->
  <main>
    <!-- Lecteur Vidéo -->
    <div class="player-container">
      <div class="stream-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="channelName">Sélectionnez un contenu</span>
      </div>
      <video id="videoPlayer" controls autoplay></video>
    </div>

    <!-- Catalogue & EPG -->
    <section class="epg-section">
      <div class="epg-header">
        <h3 id="sectionTitle">Chaînes TV</h3>
      </div>
      <div class="channels-grid" id="channelsList">
        <!-- Contenu généré dynamiquement -->
      </div>
    </section>
  </main>

  <script>
    /* ==========================================================================
       1. REQUÊTES & PROXY CORS
       ========================================================================== */
    const StreamConfig = {
      corsProxy: "https://corsproxy.io/?",
      useProxyFallback: true,
      timeout: 10000
    };

    async function fetchWithFallback(url, options = {}) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), StreamConfig.timeout);

      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        if (!response.ok) throw new Error(`HTTP: ${response.status}`);
        return await response.text();
      } catch (error) {
        clearTimeout(id);
        if (StreamConfig.useProxyFallback) {
          const proxyUrl = `${StreamConfig.corsProxy}${encodeURIComponent(url)}`;
          const proxyController = new AbortController();
          const proxyId = setTimeout(() => proxyController.abort(), StreamConfig.timeout);
          
          const proxyResponse = await fetch(proxyUrl, { ...options, signal: proxyController.signal });
          clearTimeout(proxyId);
          if (!proxyResponse.ok) throw new Error(`HTTP Proxy: ${proxyResponse.status}`);
          return await proxyResponse.text();
        }
        throw error;
      }
    }

    /* ==========================================================================
       2. SERVICE STALKER PORTAL (HANDSHAKE, VOD & SÉRIES)
       ========================================================================== */
    class StalkerPortalService {
      constructor(portalUrl, macAddress) {
        this.baseUrl = portalUrl.replace(/\/+$/, '');
        if (!this.baseUrl.includes('load.php')) {
          this.baseUrl += '/stalker_portal/server/load.php';
        }
        this.mac = macAddress.trim().toUpperCase();
        this.token = null;
      }

      async request(params) {
        const queryParams = new URLSearchParams({
          type: params.type || 'stb',
          action: params.action,
          ...params
        });

        if (this.token) queryParams.append('token', this.token);

        const fullUrl = `${this.baseUrl}?${queryParams.toString()}`;
        const responseText = await fetchWithFallback(fullUrl, {
          headers: {
            'X-User-Agent': 'Model: MAG250; Link: WiFi',
            'Cookie': `mac=${encodeURIComponent(this.mac)}`
          }
        });

        try {
          const json = JSON.parse(responseText);
          return json.js || json;
        } catch (e) {
          throw new Error(`Réponse JSON invalide du serveur Stalker.`);
        }
      }

      async handshake() {
        const data = await this.request({ action: 'handshake', mac: this.mac });
        if (data && data.token) {
          this.token = data.token;
          return true;
        }
        throw new Error('Échec du Handshake Stalker. Vérifiez l\'adresse MAC.');
      }

      async getVodMovies(categoryId = '*', page = 1) {
        const res = await this.request({ type: 'vod', action: 'get_ordered_list', category: categoryId, p: page });
        return (res.data || []).map(m => ({ id: m.id, title: m.name, year: m.year || '', cmd: m.cmd, desc: m.description || '' }));
      }

      async getSeriesList(categoryId = '*', page = 1) {
        const res = await this.request({ type: 'series', action: 'get_ordered_list', category: categoryId, p: page });
        return (res.data || []).map(s => ({ id: s.id, title: s.name, year: s.year || '', desc: s.description || '' }));
      }

      async getSeriesEpisodes(seriesId) {
        const res = await this.request({ type: 'series', action: 'get_ordered_list', movie_id: seriesId });
        return (res.data || []).map(ep => ({
          id: ep.id,
          title: ep.name || `Épisode ${ep.series_number}`,
          season: ep.season_number || 1,
          episode: ep.series_number || 1,
          cmd: ep.cmd
        }));
      }

      async getStreamUrl(cmd) {
        const res = await this.request({ type: 'vod', action: 'create_link', cmd: cmd, forced_storage: '0' });
        let rawCmd = res.cmd || res;
        if (typeof rawCmd === 'string') {
          const match = rawCmd.match(/(https?:\/\/[^\s]+)/);
          if (match) return match[1];
        }
        throw new Error('Impossible d\'extraire l\'URL de flux.');
      }
    }

    /* ==========================================================================
       3. MOTEUR DE LECTURE VIDÉO
       ========================================================================== */
    class StreamHubPlayer {
      constructor(videoElement, statusDot, channelLabel) {
        this.video = videoElement;
        this.statusDot = statusDot;
        this.channelLabel = channelLabel;
        this.hls = null;
        this.mpegtsPlayer = null;
        this.currentUrl = null;
      }

      setStatus(state) {
        this.statusDot.className = 'status-dot ' + state;
      }

      loadStream(url, name) {
        this.destroy();
        this.currentUrl = url;
        if (name) this.channelLabel.textContent = name;
        this.setStatus('connecting');

        if (url.includes('.m3u8')) {
          this.playHLS(url);
        } else if (url.includes('.ts')) {
          this.playMpegTS(url);
        } else {
          this.video.src = url;
          this.video.play().then(() => this.setStatus('')).catch(() => this.setStatus('error'));
        }
      }

      playHLS(url) {
        if (Hls.isSupported()) {
          this.hls = new Hls();
          this.hls.loadSource(url);
          this.hls.attachMedia(this.video);
          this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
            this.video.play().then(() => this.setStatus('')).catch(() => {});
          });
          this.hls.on(Hls.Events.ERROR, () => this.setStatus('error'));
        } else if (this.video.canPlayType('application/vnd.apple.mpegurl')) {
          this.video.src = url;
          this.video.play().then(() => this.setStatus('')).catch(() => this.setStatus('error'));
        }
      }

      playMpegTS(url) {
        if (mpegts.isSupported()) {
          this.mpegtsPlayer = mpegts.createPlayer({ type: 'mse', isLive: true, url: url });
          this.mpegtsPlayer.attachMediaElement(this.video);
          this.mpegtsPlayer.load();
          this.mpegtsPlayer.play().then(() => this.setStatus('')).catch(() => this.setStatus('error'));
        } else {
          this.video.src = url;
          this.video.play().then(() => this.setStatus('')).catch(() => this.setStatus('error'));
        }
      }

      destroy() {
        if (this.hls) { this.hls.destroy(); this.hls = null; }
        if (this.mpegtsPlayer) { this.mpegtsPlayer.destroy(); this.mpegtsPlayer = null; }
        this.video.pause();
        this.video.removeAttribute('src');
        this.video.load();
      }
    }

    /* ==========================================================================
       4. APPLICATION & LOGIQUE D'INTERACTION
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      const videoElem = document.getElementById('videoPlayer');
      const statusDot = document.getElementById('statusDot');
      const channelLabel = document.getElementById('channelName');
      const grid = document.getElementById('channelsList');
      const sectionTitle = document.getElementById('sectionTitle');
      
      const player = new StreamHubPlayer(videoElem, statusDot, channelLabel);
      let stalker = null;

      // Configuration Stalker par défaut (à personnaliser)
      let stalkerUrl = localStorage.getItem('stalker_url') || '';
      let stalkerMac = localStorage.getItem('stalker_mac') || '';

      // Vues
      const loadDemoTv = () => {
        sectionTitle.textContent = "Chaînes TV de démonstration";
        grid.innerHTML = '';
        const demoChannels = [
          { name: 'Big Buck Bunny', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', epg: 'Vidéo HLS' },
          { name: 'Sintel Multi-bitrate', url: 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8', epg: 'Film HLS' }
        ];

        demoChannels.forEach(ch => {
          const card = document.createElement('div');
          card.className = 'channel-card';
          card.tabIndex = 0;
          card.innerHTML = `<div class="channel-title">${ch.name}</div><div class="channel-epg">${ch.epg}</div>`;
          card.onclick = () => player.loadStream(ch.url, ch.name);
          grid.appendChild(card);
        });
      };

      const ensureStalkerConnected = async () => {
        if (!stalkerUrl || !stalkerMac) {
          stalkerUrl = prompt("Entrez l'URL de votre serveur Stalker :", "http://exemple.com:8080");
          stalkerMac = prompt("Entrez votre adresse MAC Stalker :", "00:1A:79:XX:XX:XX");
          if (stalkerUrl && stalkerMac) {
            localStorage.setItem('stalker_url', stalkerUrl);
            localStorage.setItem('stalker_mac', stalkerMac);
          } else {
            alert("Informations Stalker manquantes.");
            return false;
          }
        }

        if (!stalker) {
          stalker = new StalkerPortalService(stalkerUrl, stalkerMac);
          try {
            await stalker.handshake();
          } catch (e) {
            alert("Erreur connexion Stalker : " + e.message);
            stalker = null;
            return false;
          }
        }
        return true;
      };

      const loadStalkerMovies = async () => {
        if (!(await ensureStalkerConnected())) return;
        sectionTitle.textContent = "Catalogue Films Stalker";
        grid.innerHTML = '<p>Chargement des films...</p>';

        try {
          const movies = await stalker.getVodMovies();
          grid.innerHTML = '';
          movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.tabIndex = 0;
            card.innerHTML = `<div class="channel-title">🎬 ${movie.title}</div><div class="channel-epg">${movie.year}</div>`;
            card.onclick = async () => {
              try {
                const streamUrl = await stalker.getStreamUrl(movie.cmd);
                player.loadStream(streamUrl, movie.title);
              } catch (err) {
                alert("Erreur lecture : " + err.message);
              }
            };
            grid.appendChild(card);
          });
        } catch (e) {
          grid.innerHTML = '<p>Impossible de charger les films.</p>';
        }
      };

      const loadStalkerSeries = async () => {
        if (!(await ensureStalkerConnected())) return;
        sectionTitle.textContent = "Catalogue Séries Stalker";
        grid.innerHTML = '<p>Chargement des séries...</p>';

        try {
          const seriesList = await stalker.getSeriesList();
          grid.innerHTML = '';
          seriesList.forEach(series => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.tabIndex = 0;
            card.innerHTML = `<div class="channel-title">📺 ${series.title}</div><div class="channel-epg">Voir les épisodes</div>`;
            card.onclick = () => loadEpisodes(series);
            grid.appendChild(card);
          });
        } catch (e) {
          grid.innerHTML = '<p>Impossible de charger les séries.</p>';
        }
      };

      const loadEpisodes = async (series) => {
        sectionTitle.textContent = `Série : ${series.title}`;
        grid.innerHTML = '<p>Chargement des épisodes...</p>';

        try {
          const episodes = await stalker.getSeriesEpisodes(series.id);
          grid.innerHTML = `<button class="btn-back" id="backToSeries">⬅ Retour aux séries</button>`;
          document.getElementById('backToSeries').onclick = loadStalkerSeries;

          episodes.forEach(ep => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.tabIndex = 0;
            card.innerHTML = `<div class="channel-title">S${ep.season} E${ep.episode} - ${ep.title}</div>`;
            card.onclick = async () => {
              try {
                const streamUrl = await stalker.getStreamUrl(ep.cmd);
                player.loadStream(streamUrl, `${series.title} - S${ep.season}E${ep.episode}`);
              } catch (err) {
                alert("Erreur lecture épisode : " + err.message);
              }
            };
            grid.appendChild(card);
          });
        } catch (e) {
          grid.innerHTML = '<p>Impossible de charger les épisodes.</p>';
        }
      };

      // Gestionnaires de clic du menu latéral
      const setActiveTab = (tabElem) => {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        tabElem.classList.add('active');
      };

      document.getElementById('tabTv').onclick = (e) => { setActiveTab(e.target); loadDemoTv(); };
      document.getElementById('tabMovies').onclick = (e) => { setActiveTab(e.target); loadStalkerMovies(); };
      document.getElementById('tabSeries').onclick = (e) => { setActiveTab(e.target); loadStalkerSeries(); };
      document.getElementById('tabConfig').onclick = () => {
        localStorage.removeItem('stalker_url');
        localStorage.removeItem('stalker_mac');
        stalker = null;
        alert("Identifiants Stalker réinitialisés. Vous serez invité à les ressaisir au prochain clic.");
      };

      // Chargement initial
      loadDemoTv();
    });
  </script>
</body>
</html>
