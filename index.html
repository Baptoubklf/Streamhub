<style>
:root{
  --bg:#0A1628;
  --surface:#0F1F38;
  --surface2:#16294A;
  --amber:#00AEEF;
  --teal:#F5F5F1;
  --text:#F5F5F1;
  --muted:#8FA3C2;
  --danger:#FF6161;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;
}
h1,h2,h3,.brand,.tile-title,.nav-label{
  font-family:'Space Grotesk','Inter',sans-serif;
}
/* ===== Layout ===== */
.app{display:flex;height:100vh;width:100vw;}
.sidebar{
  width:220px;
  background:linear-gradient(180deg,#0C1930,#0A1628);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;align-items:stretch;
  padding:22px 0;
  flex-shrink:0;
  z-index:20;
}
.brand{
  color:var(--amber);
  font-weight:700;
  font-size:20px;
  letter-spacing:.5px;
  margin-bottom:34px;
  white-space:nowrap;
  overflow:hidden;
  width:100%;
  text-align:left;
  padding-left:22px;
}
.nav-item{
  width:100%;
  display:flex;align-items:center;gap:14px;
  padding:14px 0 14px 28px;
  color:var(--muted);
  cursor:pointer;
  position:relative;
  white-space:nowrap;
  overflow:hidden;
}
.nav-item svg{flex-shrink:0;width:22px;height:22px;}
.nav-label{opacity:1;font-size:14px;font-weight:600;}
.nav-item.active{color:var(--amber);background:rgba(0,174,239,0.12);}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);
}
.nav-group-label{
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:#4A6488;padding:18px 0 8px 28px;
}
.nav-group-label:first-of-type{padding-top:4px;}
.sidebar-spacer{flex:1;}
.sidebar-mini-preview{
  margin:0 16px 18px;padding:10px;border-radius:10px;background:var(--surface2);
  display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid rgba(255,255,255,.06);
}
.sidebar-mini-preview:hover{background:#1c355c;}
.mini-preview-thumb{
  width:46px;height:46px;border-radius:6px;background-size:cover;background-position:center;
  background-color:#0A1628;flex-shrink:0;
}
.mini-preview-info{overflow:hidden;}
.mini-preview-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.mini-preview-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item:focus-visible, .tile:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--teal);outline-offset:2px;
}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:64px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(180deg,rgba(10,14,20,.9),rgba(10,14,20,0));
}
.topbar h2{font-size:20px;font-weight:600;}
.clock{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}
.view{flex:1;overflow-y:auto;padding:8px 32px 40px;}
.view::-webkit-scrollbar{width:8px;}
.view::-webkit-scrollbar-thumb{background:#252c37;border-radius:4px;}

/* ===== Rows / tiles ===== */
.row{margin-bottom:34px;}
.row-title{font-size:16px;font-weight:600;margin-bottom:14px;color:#C9D2DC;}
.tiles{display:flex;gap:16px;overflow-x:auto;padding:8px 2px 14px;}
.tiles::-webkit-scrollbar{height:6px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}

.tile{
  position:relative;
  flex:0 0 200px;
  height:120px;
  border-radius:10px;
  background:var(--surface2);
  cursor:pointer;
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;
  transition:transform .18s ease;
  border:2px solid transparent;
}
.grid .tile{flex:none;width:100%;}
.tile:hover, .tile.focused{
  transform:scale(1.06);
  z-index:2;
  border-color:var(--amber);
  box-shadow:0 0 0 3px rgba(0,174,239,.35), 0 10px 24px rgba(0,0,0,.5);
}
.tile.focused::after{
  content:'';position:absolute;inset:-6px;border-radius:14px;
  background:conic-gradient(from 0deg, var(--amber), transparent 30%, transparent 70%, var(--amber));
  z-index:-1;
  animation:dial 2.4s linear infinite;
  opacity:.55;
}
@keyframes dial{to{transform:rotate(360deg);}}
.tile .thumb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.85;}
.tile .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.85));}
.tile-body{position:relative;padding:10px 12px;z-index:1;}
.tile-title{font-size:13px;font-weight:600;line-height:1.25;}
.tile-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.tile-epg{font-size:10px;color:var(--amber);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-badge{
  position:absolute;top:8px;right:8px;z-index:2;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,.55);color:var(--teal);letter-spacing:.5px;
}

/* ===== Hero ===== */
.hero{
  height:260px;border-radius:14px;position:relative;overflow:hidden;margin-bottom:32px;
  background:radial-gradient(circle at 20% 20%, #1c2431, #0A0E14 70%);
  display:flex;align-items:flex-end;padding:28px;
  border:1px solid rgba(255,255,255,.05);
}
.hero-netflix{
  height:340px;
  background:
    linear-gradient(180deg, rgba(10,10,10,0) 40%, rgba(10,10,10,1) 100%),
    radial-gradient(circle at 15% 25%, rgba(0,174,239,.35), transparent 55%),
    linear-gradient(135deg, #1a1a1a, #0A0A0A 70%);
  border:none;
}
.hero-actions{display:flex;gap:12px;margin-top:18px;}
.hero-btn{
  border:none;border-radius:6px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.hero-btn-primary{background:#fff;color:#000;}
.hero-btn-primary:hover{background:rgba(255,255,255,.85);}
.hero-btn-secondary{background:rgba(109,109,110,.5);color:#fff;}
.hero-btn-secondary:hover{background:rgba(109,109,110,.35);}
.hero h1{font-size:30px;margin-bottom:8px;}
.hero p{color:var(--muted);max-width:520px;font-size:14px;line-height:1.5;}
.hero .tag{color:var(--amber);font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:10px;text-transform:uppercase;}

/* ===== Forms ===== */
.panel{background:var(--surface);border-radius:12px;padding:24px;margin-bottom:24px;border:1px solid rgba(255,255,255,.05);}
.panel h3{font-size:15px;margin-bottom:16px;color:var(--amber);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a3340;
  background:#0D1218;color:var(--text);font-size:14px;font-family:inherit;
}
.field textarea{min-height:90px;resize:vertical;}
.row-inline{display:flex;gap:12px;}
.row-inline .field{flex:1;}
.btn{
  background:var(--amber);color:#FFFFFF;border:none;padding:10px 18px;border-radius:8px;
  font-weight:700;cursor:pointer;font-size:13px;letter-spacing:.3px;
}
.btn.secondary{background:transparent;border:1px solid #2a3340;color:var(--text);}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.btn:hover{filter:brightness(1.1);}
.subtabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.subtab{
  padding:8px 16px;border-radius:20px;background:var(--surface2);color:var(--muted);
  font-size:13px;cursor:pointer;font-weight:600;
}
.subtab.active{background:var(--amber);color:#FFFFFF;}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px;padding:10px 12px;background:rgba(255,255,255,.03);border-left:3px solid var(--teal);border-radius:4px;}
.empty{color:var(--muted);font-size:13px;padding:20px 0;}

.search-bar{
  display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:20px;padding:8px 16px;width:260px;
}
.search-bar input{background:transparent;border:none;color:var(--text);font-size:13px;width:100%;outline:none;}

/* ===== Player Page ===== */
.player-page{display:flex;flex-direction:column;height:100%;}
.player-stage{
  flex:1;background:#000;border-radius:14px;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;min-height:0;
}
.player-stage video, .player-stage iframe{width:100%;height:100%;border:none;background:#000;}
.player-info{padding:18px 4px 6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.player-info h2{font-size:18px;font-weight:600;}
.player-info .sub{color:var(--muted);font-size:13px;margin-top:2px;}
.player-back{
  background:var(--surface2);border:none;color:var(--text);padding:10px 18px;border-radius:8px;
  cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;flex-shrink:0;margin-right:16px;
}
.player-back:hover{background:#232b37;}
.player-status-line{color:var(--muted);font-size:12px;margin-top:8px;}
</style>
</head>

<script>
/* ===================== ESCAPE HTML (XSS SAFE) ===================== */
function escapeHTML(str){
  return String(str || '').replace(/[&<>"']/g, match => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[match]));
}

/* ===================== STORAGE ===================== */
const DB = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem('sh_'+k)) ?? d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem('sh_'+k, JSON.stringify(v)); }
};
let state = {
  youtube: DB.get('youtube', []),
  m3u: DB.get('m3u', {url:'', raw:'', channels:[]}),
  xtream: DB.get('xtream', {server:'',username:'',password:'',categories:[],streams:[]}),
  stalker: DB.get('stalker', {portal:'',mac:'',channels:[]}),
  history: DB.get('history', []),
  proxy: DB.get('proxy', 'https://STREAMHUB--5494c6567b9011f18e851607ee4eb77e.web.val.run'),
  googleClientId: DB.get('googleClientId', '654265541879-4f8mb6u2m507aiju0iu87r9dh5p8s8dr.apps.googleusercontent.com'),
  youtubeApiKey: DB.get('youtubeApiKey', 'AIzaSyCL9edDCtFY64GZH7sZVnmi4g7Cetoorik'),
  epgUrl: DB.get('epgUrl', 'https://xmltvfr.fr/xmltv/xmltv_fr.xml.gz'),
  subscriptions: [],
  view: 'home',
};

function save(){
  DB.set('youtube', state.youtube);
  DB.set('m3u', state.m3u);
  DB.set('xtream', state.xtream);
  DB.set('stalker', state.stalker);
  DB.set('history', state.history);
  DB.set('proxy', state.proxy);
  DB.set('googleClientId', state.googleClientId);
  DB.set('youtubeApiKey', state.youtubeApiKey);
  DB.set('epgUrl', state.epgUrl);
}

function pushHistory(item){
  state.history.unshift({...item, ts:Date.now()});
  state.history = state.history.slice(0,20);
  save();
  if(typeof updateMiniPreview === 'function') updateMiniPreview();
}

if(!state.proxy) state.proxy = 'https://streamhub-proxy.onrender.com';
if(!state.youtubeApiKey) state.youtubeApiKey = 'AIzaSyCL9edDCtFY64GZH7sZVnmi4g7Cetoorik';
if(!state.epgUrl || state.epgUrl.includes('iptv-org/epg/gh-pages') || state.epgUrl.includes('epgshare01.online') || state.epgUrl.includes('xmltv_tnt.zip')){
  state.epgUrl = 'https://xmltvfr.fr/xmltv/xmltv_fr.xml.gz';
}
save();

/* ===================== NAV ===================== */
const titles = {home:'Accueil', youtube:'YouTube', molotov:'Molotov TV', iptv:'IPTV', guide:'Guide TV', sources:'Mes sources'};
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=> switchView(el.dataset.view));
  el.addEventListener('keydown', e=>{ if(e.key==='Enter') switchView(el.dataset.view); });
});
function switchView(v){
  state.view = v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===v));
  document.getElementById('viewTitle').textContent = titles[v];
  render();
}

/* ===================== CLOCK ===================== */
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock,1000); tickClock();

/* ===================== RENDER ROUTER ===================== */
const viewEl = document.getElementById('view');
function updateMiniPreview(){
  const box = document.getElementById('sidebarMiniPreview');
  if(!box) return;
  const last = state.history[0];
  if(!last){ box.style.display = 'none'; return; }
  box.style.display = 'flex';
  document.getElementById('miniPreviewTitle').textContent = last.title;
  const thumb = document.getElementById('miniPreviewThumb');
  thumb.style.backgroundImage = last.id ? `url('https://img.youtube.com/vi/${last.id}/default.jpg')` : '';
  box.onclick = () => playItem(last);
}

function render(){
  if(state.view==='home') renderHome();
  else if(state.view==='youtube') renderYoutube();
  else if(state.view==='molotov') renderMolotov();
  else if(state.view==='iptv') renderIptv('m3u');
  else if(state.view==='guide') renderGuide();
  else if(state.view==='sources') renderSources();
  attachFocusNav();
  updateMiniPreview();
}

function tileHTML({title, sub, badge, thumb, epg, onclickAttr}){
  return `<div class="tile" tabindex="0" ${onclickAttr}>
    ${thumb?`<div class="thumb" style="background-image:url('${escapeHTML(thumb)}')"></div>`:''}
    <div class="scrim"></div>
    ${badge?`<div class="tile-badge">${escapeHTML(badge)}</div>`:''}
    <div class="tile-body">
      <div class="tile-title">${escapeHTML(title)}</div>
      ${sub?`<div class="tile-sub">${escapeHTML(sub)}</div>`:''}
      ${epg?`<div class="tile-epg">📺 ${escapeHTML(epg)}</div>`:''}
    </div>
  </div>`;
}

/* ===================== HOME ===================== */
function renderHome(){
  const recent = state.history;
  const lastWatched = recent[0];
  viewEl.innerHTML = `
    <div class="hero hero-netflix">
      <div>
        <div class="tag">Votre hub personnel</div>
        <h1>Toutes vos sources, un seul écran</h1>
        <p>YouTube, Molotov TV et vos flux IPTV réunis dans une interface moderne. Configurez vos sources dans l'onglet <strong>Sources</strong>.</p>
        <div class="hero-actions">
          ${lastWatched ? `<button class="hero-btn hero-btn-primary" id="heroPlay">▶ Lecture</button>` : ''}
          <button class="hero-btn hero-btn-secondary" id="heroInfo">ℹ Plus d'infos</button>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="row-title">Reprendre la lecture</div>
      <div class="tiles" id="recentRow">
        ${recent.length? recent.map(r=>tileHTML({title:r.title, sub:r.source, badge:r.source, onclickAttr:`data-play='${encodeURIComponent(JSON.stringify(r))}'`})).join(''): '<div class="empty">Rien pour l\'instant — lancez une chaîne ou une vidéo.</div>'}
      </div>
    </div>
    <div class="row">
      <div class="row-title">Accès rapide</div>
      <div class="tiles">
        ${tileHTML({title:'Guide TV', sub:'Programme en direct', onclickAttr:`data-nav="guide"`})}
        ${tileHTML({title:'IPTV M3U', sub:'Playlist personnelle', onclickAttr:`data-nav="iptv"`})}
        ${tileHTML({title:'YouTube', sub:'Chaînes & vidéos', onclickAttr:`data-nav="youtube"`})}
        ${tileHTML({title:'Sources', sub:'Configurer mes accès', onclickAttr:`data-nav="sources"`})}
      </div>
    </div>`;
  viewEl.querySelectorAll('[data-nav]').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.nav)));
  viewEl.querySelectorAll('[data-play]').forEach(t=>t.addEventListener('click',()=>{
    const item = JSON.parse(decodeURIComponent(t.dataset.play));
    playItem(item);
  }));
  const heroPlay = document.getElementById('heroPlay');
  if(heroPlay) heroPlay.addEventListener('click', ()=> playItem(lastWatched));
  const heroInfo = document.getElementById('heroInfo');
  if(heroInfo) heroInfo.addEventListener('click', ()=> switchView('sources'));
}

/* ===================== GUIDE TV (EPG / XMLTV) & MATCHING IPTV ===================== */
let guideData = null; 
let guideLoading = false;
let guideError = null;

function parseXmltvDate(str){
  const m = str.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?$/);
  if(!m) return null;
  const [, y, mo, d, h, mi, s, tz] = m;
  let iso = `${y}-${mo}-${d}T${h}:${mi}:${s}`;
  if(tz) iso += tz.slice(0,3)+':'+tz.slice(3);
  else iso += 'Z';
  return new Date(iso);
}

function cleanChannelName(str){
  return (str || '').toLowerCase()
    .replace(/fhd|hd|sd|4k|1080p|720p|fr|france|\|\s*fr/gi, '')
    .replace(/[^a-z0-9]/g, '')
    .trim();
}

async function fetchGuideText(url){
  const isGzip = /\.gz(\?|$)/i.test(url);
  const isZip = /\.zip(\?|$)/i.test(url);
  async function tryFetch(targetUrl){
    const res = await fetch(targetUrl);
    if(!res.ok) throw new Error(`Le serveur a répondu avec le statut ${res.status}.`);
    if(isZip){
      const buf = await res.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      const xmlFile = Object.values(zip.files).find(f => !f.dir && /\.xml$/i.test(f.name));
      if(!xmlFile) throw new Error('Aucun fichier .xml trouvé dans l\'archive .zip.');
      return xmlFile.async('string');
    }
    if(isGzip){
      const buf = await res.arrayBuffer();
      return pako.ungzip(new Uint8Array(buf), {to:'string'});
    }
    return res.text();
  }
  try{
    return await tryFetch(url);
  }catch(networkErr){
    const proxy = (state.proxy||'').trim();
    if(!proxy) throw networkErr;
    const proxied = proxy.endsWith('=')||proxy.endsWith('/') ? proxy+encodeURIComponent(url) : (()=>{ const p=new URL(proxy); p.searchParams.set('url', url); return p.toString(); })();
    return await tryFetch(proxied);
  }
}

async function loadGuideData(){
  if(guideLoading) return;
  guideLoading = true; guideError = null;
  if(state.view === 'guide') renderGuide();
  try{
    const url = state.epgUrl;
    if(!url) throw new Error('Aucune source EPG configurée (onglet Sources).');
    const text = await fetchGuideText(url);
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.querySelector('parsererror')) throw new Error('Le fichier XMLTV reçu est invalide.');

    const channels = Array.from(doc.querySelectorAll('channel')).map(ch=>({
      id: ch.getAttribute('id'),
      name: ch.querySelector('display-name')?.textContent || ch.getAttribute('id'),
      cleanName: cleanChannelName(ch.querySelector('display-name')?.textContent || ch.getAttribute('id'))
    }));

    const programmes = new Map();
    const now = new Date();
    Array.from(doc.querySelectorAll('programme')).forEach(p=>{
      const chId = p.getAttribute('channel');
      const start = parseXmltvDate(p.getAttribute('start'));
      const stop = parseXmltvDate(p.getAttribute('stop'));
      if(!start || !stop) return;
      if(stop < now || start > new Date(now.getTime()+24*3600*1000)) return;
      if(!programmes.has(chId)) programmes.set(chId, []);
      programmes.get(chId).push({
        start, stop,
        title: p.querySelector('title')?.textContent || 'Sans titre',
        desc: p.querySelector('desc')?.textContent || ''
      });
    });
    programmes.forEach(list => list.sort((a,b)=>a.start-b.start));

    guideData = { channels, programmes };
  }catch(e){
    guideError = e.message;
  }
  guideLoading = false;
  if(state.view === 'guide' || state.view === 'iptv') render();
}

/* Obtenir le programme actuel d'une chaîne IPTV */
function getCurrentEpgForChannel(channelName, tvgId){
  if(!guideData) return null;
  const now = new Date();
  const targetClean = cleanChannelName(channelName);
  
  // Chercher par tvg-id ou par nom épuré
  const matchedCh = guideData.channels.find(c => 
    (tvgId && c.id === tvgId) || (c.cleanName && c.cleanName === targetClean)
  );
  
  if(!matchedCh) return null;
  const progs = guideData.programmes.get(matchedCh.id) || [];
  return progs.find(p => p.start <= now && p.stop > now);
}

/* Trouver le flux IPTV correspondant à une chaîne EPG */
function findIptvMatchForEpg(epgChannelName, epgId){
  const targetClean = cleanChannelName(epgChannelName);
  
  // Recherche M3U
  let m3uCh = (state.m3u.channels || []).find(c => (c.tvgId && c.tvgId === epgId) || cleanChannelName(c.name) === targetClean);
  if(m3uCh) return { title: m3uCh.name, source: 'M3U', type: 'hls', url: m3uCh.url };

  // Recherche Xtream
  let xtCh = (state.xtream.streams || []).find(c => cleanChannelName(c.name) === targetClean);
  if(xtCh){
    const url = `${state.xtream.server}/live/${state.xtream.username}/${state.xtream.password}/${xtCh.id}.m3u8`;
    return { title: xtCh.name, source: 'Xtream', type: 'hls', url };
  }

  // Recherche Stalker
  let stCh = (state.stalker.channels || []).find(c => cleanChannelName(c.name) === targetClean);
  if(stCh) return { title: stCh.name, source: 'Stalker', stalkerObj: stCh };

  return null;
}

    /(?:v=|\/videos\/|embed\/|youtu\.be\/|\/live\/)([a-zA-Z0-9_-]{11})/,

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const channels = [];
  let cur = null;
  for(const line of lines){
    if(line.startsWith('#EXTINF')){
      const nameMatch = line.split(',').pop();
      const logo = (line.match(/tvg-logo="([^"]+)"/)||[])[1];
      const tvgId = (line.match(/tvg-id="([^"]+)"/)||[])[1];
      const group = (line.match(/group-title="([^"]+)"/)||[])[1];
      cur = { name: nameMatch?.trim() || 'Chaîne', logo, group, tvgId };
    } else if(line && !line.startsWith('#')){
      if(cur){ cur.url = line.trim(); channels.push(cur); cur=null; }
    }
  }
  return channels;
}

async function stalkerConnect(){
  const portal = document.getElementById('stPortal').value.replace(/\/portal\.php.*$/,'');
  const mac = document.getElementById('stMac').value;
  const statusEl = document.getElementById('stStatus');
  statusEl.style.display='block'; statusEl.textContent='Handshake...';
  try{
    const cookieMac = `mac=${encodeURIComponent(mac)}`;
    const hsRes = await proxied(`${portal}/portal.php?type=stb&action=handshake&JsHttpRequest=1-xml`, { 'Cookie': cookieMac });
    const hsData = await hsRes.json();
    const token = hsData?.js?.token;
    if(!token) throw new Error("Token non reçu.");

    const chRes = await proxied(`${portal}/portal.php?type=itv&action=get_all_channels&JsHttpRequest=1-xml`, { 'Authorization': 'Bearer '+token, 'Cookie': cookieMac });
    const chData = await chRes.json();
    const list = (chData?.js?.data || []).map(c=>({ name: c.name, id: c.id, cmd: c.cmd }));

    state.stalker = { portal, mac, channels: list, token };
    save();
    statusEl.textContent = list.length + ' chaînes chargées.';
    renderIptv('stalker');
  }catch(e){ statusEl.textContent = "Erreur : " + e.message; }
}

async function resolveStalkerStreamUrl(channel){
  const st = state.stalker;
  const cookieMac = `mac=${encodeURIComponent(st.mac)}`;
  const url = `${st.portal}/portal.php?type=itv&action=create_link&cmd=${encodeURIComponent(channel.cmd)}&JsHttpRequest=1-xml`;
  const res = await proxied(url, { 'Authorization': 'Bearer '+st.token, 'Cookie': cookieMac });
  const data = await res.json();
  let streamUrl = (data?.js?.cmd || '').replace(/^ffmpeg\s+/i, '').trim();
  if(!streamUrl) throw new Error('Flux non disponible.');
  return streamUrl;
}

function proxied(url, extraHeaders){
  const proxy = (state.proxy || '').trim();
  if(!proxy) return fetch(url, extraHeaders? {headers:extraHeaders} : undefined);
  if(proxy.endsWith('=') || proxy.endsWith('/')) return fetch(proxy + encodeURIComponent(url));
  const p = new URL(proxy);
  p.searchParams.set('url', url);
  if(extraHeaders) p.searchParams.set('headers', JSON.stringify(extraHeaders));
  return fetch(p.toString());
}

    t.addEventListener('click',()=>{
      const s = state.xtream.streams[t.dataset.idx];
      const url = `${state.xtream.server}/live/${state.xtream.username}/${state.xtream.password}/${s.id}.m3u8`;
      openVideoPlayer(s.name, url, 'Xtream');
      pushHistory({title:s.name, source:'Xtream', type:'hls', url});
    });
  });

  const stBtn = document.getElementById('stConnect');
  if(stBtn) stBtn.addEventListener('click', stalkerConnect);
  viewEl.querySelectorAll('#stGrid .tile[data-idx]').forEach(t=>{
    t.addEventListener('click', async ()=>{
      const c = state.stalker.channels[t.dataset.idx];
      try{
        const url = await resolveStalkerStreamUrl(c);
        openVideoPlayer(c.name, url, 'Stalker', true, {'Cookie': `mac=${encodeURIComponent(state.stalker.mac)}`});
        pushHistory({title:c.name, source:'Stalker', type:'hls', url});
      }catch(e){ alert("Erreur Stalker : "+e.message); }
    });
  });
}

/* ===================== SOURCES / SETTINGS ===================== */
function renderSources(){
  viewEl.innerHTML = `
    <div class="panel">
      <h3>📅 Guide TV (EPG)</h3>
      <div class="field"><label>URL XMLTV (.xml / .xml.gz)</label><input id="epgUrlInput" value="${escapeHTML(state.epgUrl||'')}"></div>
      <button class="btn" id="saveEpgUrl">Enregistrer l'EPG</button>
    </div>
    <div class="panel">
      <h3>Proxy CORS</h3>
      <div class="field"><label>URL Proxy</label><input id="proxyInput" value="${escapeHTML(state.proxy||'')}"></div>
      <button class="btn" id="saveProxy">Enregistrer Proxy</button>
    </div>
    <button class="btn danger" id="resetAll">Réinitialiser tout</button>`;
  document.getElementById('saveEpgUrl').addEventListener('click',()=>{
    state.epgUrl = document.getElementById('epgUrlInput').value.trim();
    save(); loadGuideData(); alert('Source EPG enregistrée.');
  });
  document.getElementById('saveProxy').addEventListener('click',()=>{
    state.proxy = document.getElementById('proxyInput').value.trim();
    save(); alert('Proxy enregistré.');
  });
  document.getElementById('resetAll').addEventListener('click',()=>{
    if(confirm('Effacer la configuration ?')){ localStorage.clear(); location.reload(); }
  });
}

/* ===================== PLAYER ===================== */
let hlsInstance = null;
let mpegtsInstance = null;
let playerData = null;
let previousView = 'home';

function openVideoPlayer(title, url, sub, forceProxy, streamHeaders){
  if(!url){ alert('URL introuvable.'); return; }
  playerData = {title, sub: sub||'', kind:'video', src:url, forceProxy: !!forceProxy, headers: streamHeaders||null};
  goToPlayerView();
}
function openFramePlayer(title, url, sub){
  playerData = {title, sub: sub||'', kind:'iframe', src:url};
  goToPlayerView();
}
function goToPlayerView(){
  if(state.view !== 'player') previousView = state.view;
  state.view = 'player';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('viewTitle').textContent = 'Lecture';
  renderPlayerView();
  attachFocusNav();
}
function backFromPlayer(){
  if(hlsInstance){ hlsInstance.destroy(); hlsInstance=null; }
  if(mpegtsInstance){ mpegtsInstance.destroy(); mpegtsInstance=null; }
  clearInterval(window.__streamhubStallWatch);
  playerData = null;
  switchView(previousView);
}
function renderPlayerView(){
  const p = playerData;
  viewEl.innerHTML = `
    <div class="player-page">
      <div class="player-info">
        <div style="display:flex;align-items:center;">
          <button class="player-back" id="playerBackBtn">← Retour</button>
          <div>
            <h2>${escapeHTML(p.title)}</h2>
            ${p.sub? `<div class="sub">${escapeHTML(p.sub)}</div>`:''}
          </div>
        </div>
      </div>
      <div class="player-stage" id="playerStage"></div>
      <div class="player-status-line" id="playerStatusLine">${p.kind==='video' ? 'Chargement...' : ''}</div>
    </div>`;
  document.getElementById('playerBackBtn').addEventListener('click', backFromPlayer);

  const stage = document.getElementById('playerStage');
  if(p.kind === 'iframe'){
    const frame = document.createElement('iframe');
    frame.src = p.src; frame.allow = 'autoplay; encrypted-media'; frame.allowFullscreen = true;
    stage.appendChild(frame);
    return;
  }

  const video = document.createElement('video');
  video.controls = true; video.autoplay = true;
  stage.appendChild(video);
  loadVideoSource(video, p.src, p.forceProxy, p.headers);
}

function loadVideoSource(video, url, viaProxy, streamHeaders){
  const statusEl = document.getElementById('playerStatusLine');
  const isRawMpegTs = /extension=ts\b/i.test(url) || /\.ts(\?|$)/i.test(url);
  const actualUrl = viaProxy ? buildProxiedUrl(url, streamHeaders) : url;

  if(hlsInstance){ hlsInstance.destroy(); hlsInstance=null; }
  if(mpegtsInstance){ mpegtsInstance.destroy(); mpegtsInstance=null; }

  if(isRawMpegTs && window.mpegts && mpegts.getFeatureList().mseLivePlayback){
    mpegtsInstance = mpegts.createPlayer({ type:'mpegts', isLive:true, url: actualUrl });
    mpegtsInstance.attachMediaElement(video);
    mpegtsInstance.load();
    mpegtsInstance.play();
  } else if(window.Hls && Hls.isSupported()){
    hlsInstance = new Hls();
    hlsInstance.loadSource(actualUrl);
    hlsInstance.attachMedia(video);
  } else {
    video.src = actualUrl;
    video.play().catch(()=>{});
  }
  if(statusEl) statusEl.textContent = '';
}

function buildProxiedUrl(url, headers){
  const proxy = (state.proxy||'').trim();
  if(!proxy) return url;
  if(proxy.endsWith('=') || proxy.endsWith('/')) return proxy + encodeURIComponent(url);
  const p = new URL(proxy);
  p.searchParams.set('url', url);
  if(headers) p.searchParams.set('headers', JSON.stringify(headers));
  return p.toString();
}

function playItem(item){
  if(item.type==='youtube') openFramePlayer(item.title, `https://www.youtube.com/embed/${item.id}?autoplay=1`, item.source);
  else openVideoPlayer(item.title, item.url, item.source);
}

/* ===================== D-PAD NAVIGATION ===================== */
function attachFocusNav(){
  const focusables = Array.from(document.querySelectorAll('.tile, .nav-item, .subtab, input, .btn, select'));
  focusables.forEach(el=>{
    el.addEventListener('mouseenter', ()=> setFocus(el));
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') el.click(); });
  });
  if(!document.activeElement || document.activeElement===document.body){
    const first = document.querySelector('.view .tile, .view .btn');
    if(first) setFocus(first);
  }
}
function setFocus(el){
  document.querySelectorAll('.focused').forEach(f=>f.classList.remove('focused'));
  el.classList.add('focused'); el.focus({preventScroll:false});
  el.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
}
function spatialNav(dir){
  const current = document.querySelector('.focused') || document.activeElement;
  const candidates = Array.from(document.querySelectorAll('.tile, .nav-item, .subtab, input, .btn')).filter(el => el.offsetParent !== null);
  if(!current || !candidates.length) return;
  const cRect = current.getBoundingClientRect();
  const cx = cRect.left + cRect.width/2, cy = cRect.top + cRect.height/2;
  let best = null, bestScore = Infinity;
  for(const el of candidates){
    if(el === current) continue;
    const r = el.getBoundingClientRect();
    const ex = r.left + r.width/2, ey = r.top + r.height/2;
    const dx = ex - cx, dy = ey - cy;
    let primary, ortho;
    if(dir==='right'){ if(dx<=4) continue; primary=dx; ortho=Math.abs(dy); }
    else if(dir==='left'){ if(dx>=-4) continue; primary=-dx; ortho=Math.abs(dy); }
    else if(dir==='down'){ if(dy<=4) continue; primary=dy; ortho=Math.abs(dx); }
    else if(dir==='up'){ if(dy>=-4) continue; primary=-dy; ortho=Math.abs(dx); }
    const score = primary + ortho*2.2;
    if(score < bestScore){ bestScore = score; best = el; }
  }
  if(best) setFocus(best);
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(state.view==='player') backFromPlayer(); return; }
  const tag = document.activeElement?.tagName;
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    spatialNav({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]);
  }
});

/* ===================== INIT ===================== */
render();
loadGuideData(); // Préchargement global de l'EPG au démarrage
</script>
